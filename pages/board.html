<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wolly街ナビ 掲示板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{
  --bg:#F6F6FC;--surface:#fff;--ink:#1F2140;--muted:#676A88;--line:#E3E4F0;
  --accent:#5A5AEF;--accent-ink:#fff;--accent-soft:#ECECFF;--pink:#FF6FAE;--sky:#35B3EE;--lemon:#FFD23F;--lav:#A68BFF;--alert:#E0475B;--green:#06C755;
  --f-display:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --shadow:0 14px 32px -22px rgba(30,30,90,.5);--r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121328;--surface:#1C1E38;--ink:#EEEFFC;--muted:#A4A7C8;--line:#2E3154;
  --accent:#8F8FFF;--accent-ink:#121328;--accent-soft:#272A50;--pink:#FF86BC;--sky:#5FC4F5;--lemon:#FFD95E;--lav:#B9A3FF;--alert:#FF6B7E;
  --shadow:0 14px 32px -22px rgba(0,0,0,.85);color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 120px}

/* 上の帯 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px}
.back{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted);padding:6px 4px;white-space:nowrap}
.ttl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:18px;white-space:nowrap}
.ttl .badge{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--pink));flex:none}
.ttl .badge .ic{width:17px;height:17px}
.ttl small{font-family:var(--f-body);font-size:11px;color:var(--muted);display:block;line-height:1.2}
.bell{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.bell .ic{width:20px;height:20px}
.bell b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
.bell b:empty{display:none}
.me{flex:none;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.me .av{width:28px;height:28px}

/* アバター */
.av{width:36px;height:36px;border-radius:50%;flex:none;display:block;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.av.none svg{fill:none;stroke:var(--muted);stroke-width:1.6;background:var(--accent-soft)}

/* 友だち追加の帯 */
.friend{margin:12px 0 4px;border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;color:#fff;
  background:linear-gradient(120deg,#5A5AEF,#A68BFF 55%,#FF6FAE);box-shadow:var(--shadow)}
.friend .fi{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.friend .fi .ic{width:24px;height:24px}
.friend p{flex:1;min-width:0;font-size:13px;line-height:1.5}
.friend p b{display:block;font-size:15px}
.nb{display:inline-block}
.friend a{flex:none;background:#fff;color:#5A5AEF;font-weight:700;font-size:13px;border-radius:999px;padding:8px 14px;text-decoration:none;white-space:nowrap}

/* 話題のタブ */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
.tab .em{font-size:16px;line-height:1}
.tab[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--tc,var(--accent));box-shadow:0 8px 18px -10px var(--tc,var(--accent))}

/* しぼりこみ */
.filt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 4px}
.sel{flex:1 1 0;min-width:0;position:relative;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 8px 0 10px;height:38px;font-size:13px}
.sel select{flex:1;min-width:0;width:100%;text-overflow:ellipsis;appearance:none;-webkit-appearance:none;border:0;background:none;padding:0 18px 0 2px;height:100%;font-weight:700;font-size:13px}
.sel::after{content:"";position:absolute;right:10px;top:15px;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.sel .ic{color:var(--accent);width:16px;height:16px}
.ages{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px -14px 2px;padding:0 14px}
.ages::-webkit-scrollbar{display:none}
.age{flex:none;font-size:12px;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap;border:1.5px solid transparent}
.age[aria-pressed="true"]{background:var(--surface);border-color:var(--accent)}
.count{font-size:12px;color:var(--muted);margin:8px 2px 4px}

/* 投稿カード */
.list{display:grid;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.card .row{display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);white-space:nowrap}
.when{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.card h3{font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.5;margin:8px 0 4px}
.card .ex{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.who{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;min-width:0}
.who .av{width:28px;height:28px}
.who b{font-weight:700;white-space:nowrap}
.who span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.meta span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.meta .ic{width:15px;height:15px}
.meta .hot{color:var(--pink);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.empty .big{font-size:40px;display:block}

/* 書くボタン */
.fab{position:fixed;right:max(16px,calc(50vw - 304px));bottom:calc(22px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:6px;padding:14px 20px;border-radius:999px;color:#fff;font-weight:700;font-size:15px;
  background:linear-gradient(135deg,var(--accent),var(--pink));box-shadow:0 14px 28px -12px rgba(90,90,239,.8)}
.fab .ic{width:20px;height:20px}
.fab.lock{background:linear-gradient(135deg,#9A9CB8,#B9BBD4);box-shadow:none}

/* シート（くわしい画面・書く画面） */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,22,60,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;height:92vh;height:92dvh;background:var(--bg);border-radius:24px 24px 0 0;
  transform:translateY(104%);transition:transform .32s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:0 -20px 40px -20px rgba(0,0,0,.35)}
.sheet.on{transform:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 16px;border-bottom:1px solid var(--line)}
.sh-head h2{flex:1;font-family:var(--f-display);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 30px}

.post h1{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.5;margin:10px 0 8px}
.post .who{margin:0 0 12px}
.post .who .av{width:36px;height:36px}
.post .txt{white-space:pre-wrap;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stamps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.stamp{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.stamp .em{font-size:17px;line-height:1}
.stamp[aria-pressed="true"]{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 12%,var(--surface));color:var(--pink)}
.stamp.pop .em{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.report{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:6px 4px;white-space:nowrap}
.report .ic{width:15px;height:15px}
.rh{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:15px;margin:18px 0 8px}
.rh .ic{color:var(--accent)}
.reply{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.reply .av{width:32px;height:32px}
.reply .bd{flex:1;min-width:0}
.reply .nm{font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.reply .nm b{white-space:nowrap}
.reply .nm span{color:var(--muted);white-space:nowrap}
.reply .nm .mine{color:var(--accent);font-weight:700}
.reply p{font-size:14px;white-space:pre-wrap;margin-top:2px}
.reply .rr{display:flex;gap:10px;margin-top:4px}
.reply .rr button{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
.reply .rr button[aria-pressed="true"]{color:var(--pink);font-weight:700}
.reply.new{animation:hl 1.6s ease}
@keyframes hl{0%{background:color-mix(in srgb,var(--lemon) 40%,transparent)}100%{background:transparent}}
.rform{position:sticky;bottom:-30px;margin:12px -16px -30px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.rform textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;background:var(--surface);font-size:16px;line-height:1.5;height:44px;max-height:120px}
.send{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--accent)}
.send:disabled{opacity:.4}
.gate{text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:14px;font-size:13px;color:var(--muted)}
.gate a{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;font-weight:700;border-radius:999px;padding:9px 16px;text-decoration:none}

/* 書く画面 */
.fm label.lb{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin:16px 0 8px}
.fm label.lb .ic{color:var(--accent)}
.fm .req{font-size:10px;color:#fff;background:var(--pink);border-radius:6px;padding:1px 6px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick button{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:700;text-align:left}
.pick button .em{font-size:18px}
.pick button[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface));color:var(--tc)}
.fm input[type=text],.fm textarea,.fm select{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--surface);font-size:16px}
.fm textarea{min-height:170px;resize:vertical;line-height:1.6}
.cnt{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
.cnt.over{color:var(--alert);font-weight:700}
.hint{display:flex;gap:8px;font-size:12px;color:var(--muted);background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-top:16px;line-height:1.6}
.hint .ic{color:var(--accent);margin-top:2px}
.err{color:var(--alert);font-size:13px;font-weight:700;margin-top:10px;min-height:1.2em}
.submit{width:100%;margin-top:12px;padding:15px;border-radius:16px;color:#fff;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;justify-content:center;align-items:center;gap:8px}
.asme{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px}
.asme small{display:block;color:var(--muted);font-size:11px}

/* お知らせ */
.nt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font-size:13px}
.nt .av{width:32px;height:32px}
.nt.unread{border-color:var(--pink);box-shadow:inset 4px 0 0 var(--pink)}
.nt small{display:block;color:var(--muted);font-size:11px}

/* トースト */
.toast{position:fixed;left:50%;bottom:96px;z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:10px 16px;border-radius:999px;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 見本の切りかえ（作っている途中だけ） */
.demo{margin:26px 0 0;border:1px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--muted)}
.demo b{color:var(--ink)}
.demo .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.demo button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.demo button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.sample{display:inline-block;font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:2px}
@media (max-width:389px){.friend{flex-wrap:wrap}.friend p{flex-basis:calc(100% - 54px)}.friend a{margin-left:54px}.ttl small{display:none}.me>span:not(.av){display:none}.me{padding:3px}.friend a{padding:7px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="wolly-btnu">
/* 11/26 とじる（×）は 32px の小さい丸にそろえる（写真や色の上でも見えるように白い丸） */
.x,.hx,.px,.wpk-x,.vx,.fs-x,.sx{width:32px!important;height:32px!important;min-width:32px!important;padding:0!important;border:0!important;border-radius:50%!important;
  background:rgba(255,255,255,.92)!important;box-shadow:0 1px 5px rgba(0,0,0,.18)!important;color:#55597A!important;font-size:18px!important;font-weight:500!important;line-height:32px!important;
  display:inline-grid!important;place-items:center!important;cursor:pointer}
.x:active,.hx:active,.px:active,.wpk-x:active,.vx:active,.fs-x:active,.sx:active{transform:scale(.92)}
/* 昔の「← 子育て補助金ガイドにもどる」（claude.ai へ出ていく）は出さない。街ナビの中では上の × でとじる */
a.back[href*="claude.ai"]{display:none!important}
</style></head>
<body>
<header class="top"><div class="in">
  <a class="back" href="../index.html" id="backBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>街ナビ</a>
  <div class="ttl"><span class="badge"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/></svg></span><div>掲示板<small>さいたま市の子育てメンバー</small></div></div>
  <button class="bell" id="bellBtn" aria-label="お知らせ"><svg class="ic" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><b id="bellN"></b></button>
  <button class="me" id="meBtn" aria-label="わたしの表示"></button>
</div></header>

<main class="wrap">
  <div id="friendBand"></div>
  <nav class="tabs" id="tabs" aria-label="話題"></nav>
  <div class="filt">
    <label class="sel"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><select id="fWard" aria-label="区でしぼる"></select></label>
    <label class="sel"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h11M4 12h7M4 17h4M17 5v14M14 16l3 3 3-3"/></svg><select id="fSort" aria-label="ならびかえ"><option value="new">新しい順</option><option value="hot">返信の多い順</option></select></label>
  </div>
  <div class="ages" id="ages" aria-label="お子さんの年ごろ"></div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>

  <div class="demo" id="demo"><b>🧪 見本の画面です</b>（投稿はこのスマホの中だけ。まだ本番の保存はしていないよ）
    <div class="bt"><button data-f="1">友だちとして見る</button><button data-f="0">友だちでない人として見る</button><button data-reset>見本にもどす</button></div></div>
</main>

<button class="fab" id="fab"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>書く</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-head"><h2 id="shTitle"></h2><button class="close" id="closeBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>とじる</button></div>
  <div class="sh-body" id="shBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- アバター（街ナビ本体と同じ。build_board_page.py が template.html から写す） ---------- */
const eyes=(y=25,dx=7,c="#2A2230")=>`<circle cx="${24-dx}" cy="${y}" r="2.6" fill="${c}"/><circle cx="${24+dx}" cy="${y}" r="2.6" fill="${c}"/><circle cx="${24-dx+.9}" cy="${y-1}" r=".9" fill="#fff"/><circle cx="${24+dx+.9}" cy="${y-1}" r=".9" fill="#fff"/>`;
