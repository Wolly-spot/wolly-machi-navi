<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>さいたま市 ソフトボール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--deep:#3a2a05;--turf:#3a2a05;--turf2:#3a2a05;--chalk:#fff;--lime:#fff19a;--ink:#3a2a05;--orange:#e8462e;--orange-d:#fff;--cream:#fff;--line:#efe6c8;--fieldbg:radial-gradient(ellipse 70% 60% at 50% 105%,#c9925a 0 55%,transparent 56%),repeating-linear-gradient(90deg,#4f8a24 0 30px,#58962a 30px 60px);--phbg:radial-gradient(circle at 50% 120%,#c9925a 0 45%,#4f8a24 46%);
  --sss:#2f7d32;--club:#1f4f8f;--school:#c26b12;--girls:#c2457a;--kids:#7a5ac8;--jhs:#13788a;--gold:#b8860b}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
.field,.pn{touch-action:pan-y}
.field,.pc{will-change:transform}
body{font-family:"Zen Maru Gothic",system-ui,sans-serif;color:var(--ink);background:var(--deep);min-height:100vh;word-break:keep-all;overflow-wrap:anywhere;line-height:1.55}
.num{font-family:"Bebas Neue",Impact,"Arial Black",sans-serif;letter-spacing:.04em;font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto}
/* ---- スコアボード ---- */
.board{background:var(--deep);color:#fff;text-align:center;padding:20px 16px 18px;position:relative;overflow:hidden}
.board::before,.board::after{content:"";position:absolute;width:150px;height:150px;border:2px solid rgba(192,221,151,.18);border-radius:50%;top:-70px}
.board::before{left:-60px}.board::after{right:-60px}
.board .en{color:var(--lime);font-size:15px;letter-spacing:.32em}
.board h1{position:relative;font-family:"Dela Gothic One","Zen Maru Gothic",sans-serif;font-weight:400;font-size:27px;line-height:1.25;margin-top:2px}
.score{display:inline-flex;gap:14px;align-items:center;margin-top:12px;background:#000;border-radius:8px;padding:6px 14px;box-shadow:inset 0 0 0 2px #2c2c2c}
.score span{font-family:"Bebas Neue",Impact,"Arial Black",sans-serif;color:var(--orange);font-size:24px;line-height:1}
.score small{color:#bbb;font-size:11px;margin-left:3px}
.score i{width:6px;height:6px;border-radius:50%;background:var(--orange);opacity:.7;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.15}}
.search{margin:14px auto 0;max-width:420px;display:flex;background:#fff;border-radius:999px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.search input{flex:1;border:0;padding:11px 16px;font:inherit;font-size:15px;outline:none;min-width:0;color:var(--ink)}
.search button{padding:0 16px;color:var(--turf);font-size:18px}
/* ---- ピッチ ---- */
.pitch{background:var(--fieldbg);position:relative;padding:18px 14px 22px;overflow:hidden}
.pitch .ln{position:absolute;inset:8px;border:2px solid rgba(255,255,255,.55);border-radius:4px;pointer-events:none}
.pitch .ln::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.55)}
.pitch .ln::after{content:"";position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border:2px solid rgba(255,255,255,.55);border-radius:50%}
.pitch h2{position:relative;color:#fff;font-size:15px;text-align:center;margin-bottom:10px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.zks{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zk{position:relative;overflow:hidden;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:17px 6px 7px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .15s}
.zk:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.zk::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;border-bottom:2px solid var(--ink);background:#f4e94a;background-image:repeating-linear-gradient(60deg,var(--wc) 0 2.5px,transparent 2.5px 8px),repeating-linear-gradient(-60deg,var(--wc) 0 2.5px,transparent 2.5px 8px);}
.zk b{display:inline-block;font-size:22px;line-height:1;color:var(--wn,#fff);background:var(--wc);border-radius:6px;padding:2px 7px 1px;margin-bottom:3px}
.zk span{display:block;font-size:23px;font-weight:700;line-height:1.15;color:var(--wt,var(--wc));letter-spacing:.04em}
.zk::after{content:"";position:absolute;right:-14px;bottom:-14px;width:42px;height:42px;border-radius:50%;background:var(--wc);opacity:.12}
.zk small{display:block;font-size:11.5px;color:#4b6b2c}
@media(min-width:600px){.zks{grid-template-columns:repeat(5,1fr)}}
/* ---- softball のアニメ ---- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dribble{display:inline-block;margin-left:4px;font-size:15px;animation:drb 1.2s ease-in-out infinite}
.board>*:not(.kk){position:relative}
.kk{position:absolute;inset:0;pointer-events:none}
.foot .fdeco{display:block;width:fit-content;margin-bottom:6px;font-size:20px}
.phx{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--phbg);color:var(--ink)}
.phx span{font-size:44px;line-height:1.1}
.phx b{font-size:22px;opacity:.75}
.scene{background:var(--deep);padding:0 12px 14px}
.scene svg{display:block;width:100%;height:min(74vw,330px);border-radius:16px;border:3px solid rgba(255,255,255,.22)}
.footscene svg{display:block;width:100%;max-width:520px;height:auto;aspect-ratio:300/70;border-radius:10px;margin-bottom:10px}
.t.park{background:#e3ecfa;color:#1d3c78}.t.mid{background:#13788a}.t.near{background:#efe3fa;color:#5b2a86}

.wind{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wind .arm{position:absolute;left:30px;bottom:34px;width:0;height:0;animation:arm 5s infinite}
.wind .arm span{position:absolute;left:-10px;top:-40px;font-size:18px}
@keyframes arm{0%{transform:rotate(0)}30%{transform:rotate(360deg)}30.1%,100%{transform:rotate(360deg);opacity:0}}
.wind .sx{position:absolute;left:30px;bottom:30px;opacity:0;animation:sx 5s linear infinite}
.wind .sy{display:block;font-size:18px;animation:spin .4s linear infinite}
@keyframes sx{0%,30%{transform:translateX(0);opacity:0}31%{opacity:1}52%{transform:translateX(calc(100vw - 100px));opacity:1}56%,100%{opacity:0;transform:translateX(calc(100vw - 100px))}}
.strike{position:absolute;right:16px;top:16px;color:#fff19a;font-size:22px;opacity:0;animation:hrt4 5s infinite}
@keyframes hrt4{0%,52%{opacity:0;transform:scale(.4)}57%{opacity:1;transform:scale(1.15)}70%{opacity:1}78%,100%{opacity:0}}
.dia{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;transform:rotate(45deg);border:2px solid rgba(255,255,255,.55);pointer-events:none}
.dia i{position:absolute;width:12px;height:12px;background:#fff;margin:-6px}
.dia i:nth-child(1){left:0;top:0}.dia i:nth-child(2){right:-12px;top:0}.dia i:nth-child(3){right:-12px;bottom:-12px}.dia i:nth-child(4){left:0;bottom:-12px}
.fdeco .bnc{display:inline-block;animation:bnc 1.2s cubic-bezier(.3,0,.7,1) infinite}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px) rotate(180deg)}}

.zk:active b,.card:active .no{animation:spin .4s linear}
.cup{display:inline-block;animation:cup 2.4s ease-in-out infinite}
@keyframes cup{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-14deg) scale(1.1)}84%{transform:rotate(12deg) scale(1.1)}}
.goldbtn{position:relative;overflow:hidden}
.goldbtn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.ov.show .cap .bb{display:inline-block;animation:drb .9s ease-in-out 3}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- しぼりこみ ---- */
.bench{background:var(--deep);padding:14px 12px 18px}
.bench h2{color:#fff;font-size:14px;margin:0 4px 8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:#fff;color:var(--ink);border:2px solid transparent;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{background:var(--orange);color:var(--orange-d);border-color:#fff}
/* ---- 一覧 ---- */
.bar{position:sticky;top:0;z-index:5;background:var(--deep);color:#fff;display:flex;align-items:center;gap:8px;padding:9px 12px}
.bar .back{font-size:14px;color:var(--lime);padding:4px 6px 4px 0}
.bar .bn{font-size:22px;color:var(--wn,#fff);background:var(--wc,#447a16);border-radius:6px;padding:2px 7px 0;line-height:1}
.nbw{display:flex;justify-content:space-between;gap:8px;background:var(--deep);padding:0 12px 8px}
.nbw button{font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 11px;border-left:5px solid var(--wc)}
.nbw button.r{border-left:0;border-right:5px solid var(--wc)}
.swipehint{color:var(--lime);font-size:11px;text-align:center;align-self:center}
.field.sl-l{animation:slL .38s cubic-bezier(.2,.9,.3,1)}.field.sl-r{animation:slR .38s cubic-bezier(.2,.9,.3,1)}
@keyframes slL{from{transform:translateX(70%);opacity:.3}}@keyframes slR{from{transform:translateX(-70%);opacity:.3}}
.bar .bt{font-size:16px;font-weight:700}
.bar .bc{margin-left:auto;font-size:12px;color:var(--lime)}
.lchips{background:var(--deep);padding:0 12px 10px;display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}
.lchips .chip{flex:none}
.lchips::-webkit-scrollbar{display:none}
.field{background:var(--fieldbg);padding:12px 10px 28px;min-height:60vh}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.empty{color:#fff;text-align:center;padding:40px 10px;font-size:14px}
.card{background:#fff;border:3px solid var(--ink);border-radius:10px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .15s;animation:pop .35s both}
.card:active{transform:scale(.97)}
@keyframes pop{from{transform:translateY(12px) scale(.97)}}
.ph{position:relative;aspect-ratio:4/3;background:#e9f2dd;overflow:hidden}
.ph img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.ph[style]::before,.pn .big[style]::before{content:"";position:absolute;inset:-12px;background:var(--bg) center/cover;filter:blur(10px) brightness(.85);opacity:.9}
.ph .no{position:absolute;left:6px;top:2px;font-size:28px;color:#fff;-webkit-text-stroke:1.4px var(--ink);paint-order:stroke;line-height:1}
.ph .nw{position:absolute;right:5px;top:5px;background:var(--orange);color:var(--orange-d);font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px}
.ph svg{width:100%;height:100%;display:block}
.cb{padding:7px 8px 9px;display:flex;flex-direction:column;gap:5px;flex:1}
.cn{font-size:13.5px;font-weight:700;line-height:1.3}
.cn span{display:block}
.cp{position:relative;padding-left:15px;font-size:11px;line-height:1.35;color:#5a6270;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cp::before{content:"";position:absolute;left:1px;top:2px;width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--orange);box-shadow:inset 0 0 0 3px var(--orange),inset 0 0 0 5px #fff}
.area{padding:18px 12px 6px}.area h3{display:flex;align-items:center;gap:8px;margin:0 2px 10px;color:#fff;font-size:20px}.area h3 i{font-style:normal;font-size:11.5px;background:#fff;color:var(--ink);border-radius:999px;padding:3px 10px}.area h3 small{font-size:12px;opacity:.8;font-weight:500}
.tg{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.t{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;color:#fff;white-space:nowrap}
.t.sss{background:var(--sss)}.t.club{background:var(--club)}.t.school{background:var(--school)}.t.girls{background:var(--girls)}.t.kids{background:var(--kids)}.t.jhs,.t.hs{background:var(--jhs)}
.t.strong{background:linear-gradient(135deg,#f6d365,#d4a017);color:#4a3200}
.best{font-size:11px;font-weight:700;color:#7a5600;background:#fff6d6;border-radius:5px;padding:2px 6px;line-height:1.35}
.goldbtn{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:14px 12px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#ffe7a3,#f2c14e 55%,#d4a017);color:#3d2a00;border:3px solid #173404;box-shadow:0 4px 0 rgba(0,0,0,.3);text-align:left}
.goldbtn .cup{font-size:30px}
.goldbtn b{display:block;font-size:17px}
.goldbtn small{display:block;font-size:12px}
.res{margin-top:12px}
.res li{list-style:none;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:8px 0;border-bottom:1.5px dashed var(--line);font-size:13px}
.res .rk{grid-row:span 2;align-self:center;background:linear-gradient(135deg,#f6d365,#d4a017);color:#3d2a00;font-weight:700;border-radius:8px;padding:4px 8px;font-size:13px;text-align:center;min-width:4.6em}
.res small{color:#55704a}
.srcs{font-size:11px;color:#55704a;margin-top:8px}
.srcs a{color:#1f4f8f}
.t.day{background:#eaf3de;color:#27500a}.t.fee{background:#faeeda;color:#633806}
/* ---- ふわっと出るパネル ---- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(9,26,6,.5);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;transition:opacity .28s}
.ov.show{opacity:1}
.pn{position:relative;width:100%;max-width:440px;max-height:calc(100vh - 28px);overflow-y:auto;overflow-x:hidden;background:rgba(255,255,255,.94);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);transform:scale(.86) translateY(16px);transition:transform .38s cubic-bezier(.2,1.25,.35,1)}
.ov.show .pn{transform:none}
.pn .big{position:relative;aspect-ratio:4/3;background:#e9f2dd;overflow:hidden;border-radius:18px 18px 0 0}
.pn .big.hasimg{aspect-ratio:auto;height:min(58vh,440px)}
.pn .big img{position:relative;width:100%;height:100%;object-fit:contain;display:block;transform:scale(1.12);transition:transform .9s cubic-bezier(.2,.9,.3,1)}
.ov.show .pn .big img{transform:none}
.pn .big svg{width:100%;height:100%}
.pn .cap{background:var(--deep);color:#fff;padding:10px 14px 11px}
.pn .cap b{display:block;font-size:19px;line-height:1.3}
.pn .cap small{color:var(--lime);font-size:12px}
.hp{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--orange);color:var(--orange-d);font-weight:700;font-size:14px;border-radius:999px;padding:7px 16px;text-decoration:none;box-shadow:0 3px 0 #b97515}
.hp:active{transform:translateY(2px);box-shadow:0 1px 0 #b97515}
.hp.none{background:#e8efe0;color:#55704a;box-shadow:none}
.pnav{position:absolute;top:calc(min(58vh,440px)/2 - 22px);z-index:3;width:40px;height:44px;border-radius:12px;background:rgba(255,255,255,.88);color:var(--ink);font-size:24px;line-height:44px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pnav.p{left:8px}.pnav.n{right:8px}
.cnt{position:absolute;left:10px;top:12px;z-index:3;background:rgba(18,48,9,.8);color:#fff;border-radius:999px;padding:2px 10px;font-size:15px}

.pn .x{position:absolute;right:10px;top:10px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);font-size:20px;line-height:36px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pb{padding:12px 16px 16px}
.pb .td{font-size:13px;letter-spacing:.2em;color:var(--ink);opacity:.75;margin-bottom:2px}
.row{display:grid;grid-template-columns:5.2em 1fr;gap:8px;padding:8px 0;border-bottom:1.5px dashed var(--line);font-size:14px}
.row dt{color:#4b6b2c;font-size:12.5px;padding-top:1px}
.row dd{font-weight:700}
.go{display:block;margin-top:14px;background:var(--orange);color:var(--orange-d);text-align:center;font-weight:700;border-radius:999px;padding:11px;text-decoration:none;box-shadow:0 4px 0 #b97515}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b97515}
.note{font-size:11.5px;color:#55704a;margin-top:10px}
.foot{color:#cfe3b5;font-size:11.5px;padding:18px 16px 40px;line-height:1.7}
.foot a{color:#fff}
</style>
</head>

function nameLines(n){
  n=String(n).trim();
  const KW=/(スポーツ少年団|サッカー少年団|少年団|ミニバスケットボール|ミニバス|バスケットボールクラブ|バレーボールクラブ|ソフトボール|ベースボールクラブ|少年野球|サッカースクール|フットボールクラブ|フットボール|音楽教室|ピアノ教室|サッカー|ピアノ|バイオリン|バレエ|書道|教室|スクール|クラブ|アカデミー|センター|道場|コース|U-\d+)/g;
  const cut=p=>{if(p.length<=9)return[p];for(const m of p.matchAll(KW)){if(m.index>=2)return[p.slice(0,m.index)].concat(cut(p.slice(m.index)))}
    const e=p.match(/(FC|SC|Jr\.?FC|U-?\d+)$/i);if(e&&e.index>=4)return[p.slice(0,e.index),e[0]];return[p]};
  const out=[];for(const p of n.split(/\s+/).flatMap(x=>x.split(/(?=【)|(?<=】)/)).filter(Boolean).flatMap(cut)){if(out.length&&(out[out.length-1]+p).length<=9)out[out.length-1]+=p;else out.push(p)}
  return out.map(p=>`<span>${esc(p)}</span>`).join("");
}

function card(t,no,ci){

function shortCup(c){return c.includes("全国")?"全国大会":c.includes("リーグ S1")?"県リーグS1":c.includes("選手権大会")&&c.includes("リーグ")?"県リーグ選手権":"県大会"}
function match(t){

  if(state.f&&state.f!=="all"){if(KIND[state.f]){if(t.k!==state.f)return false}else if(!t.tg.includes(state.f))return false}

  return true;
}

function areaHtml(){let n=0;return AREAS.map(a=>{const L=D.filter(t=>t.pf===a[0]);return `<div class="area"><h3>${esc(a[0])}<i>${esc(a[1])}</i><small>${L.length}${UNIT}</small></h3><div class="grid">${L.map(t=>{n++;return card(t,n,n-1)}).join("")}</div></div>`}).join("")}

function panelHtml(ci){
  const t=CUR[ci],no=ci+1;

function openTeam(ci){
  let cur=ci;
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="pn" role="dialog"><button class="x" aria-label="とじる">×</button><span class="cnt num"></span>${CUR.length>1?`<button class="pnav p" aria-label="前のチーム">‹</button><button class="pnav n" aria-label="次のチーム">›</button>`:""}<div class="pc"></div></div>`;
  const pn=ov.querySelector(".pn"),pc=ov.querySelector(".pc"),cnt=ov.querySelector(".cnt");
  const show=()=>{pc.innerHTML=panelHtml(cur);cnt.textContent=`${cur+1} / ${CUR.length}`;pn.setAttribute("aria-label",CUR[cur].n);pn.scrollTop=0};
  const commit=d=>{cur=(cur+d+CUR.length)%CUR.length;show();return pc};
  const go=d=>{if(CUR.length<2)return;slideGo(pc,d,commit)};
  show();
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add("show")));
  const close=()=>{ov.classList.remove("show");document.body.style.overflow="";setTimeout(()=>ov.remove(),300);document.removeEventListener("keydown",key)};
  const key=e=>{if(e.key==="Escape")close();else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)};
  document.addEventListener("keydown",key);
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest(".x"))close();else if(e.target.closest(".pnav.n"))go(1);else if(e.target.closest(".pnav.p"))go(-1)});

// 指についてくるスライド
function slideGo(T,d,commit){
  const W=(T.offsetWidth||innerWidth)+24;
  T.style.transition="transform .2s cubic-bezier(.4,0,1,1),opacity .2s";T.style.transform=`translate3d(${-d*W}px,0,0)`;T.style.opacity=".35";
  setTimeout(()=>{const N=commit(d);if(!N)return;const W2=(N.offsetWidth||innerWidth)+24;
    N.style.transition="none";N.style.transform=`translate3d(${d*W2*.55}px,0,0)`;N.style.opacity=".35";void N.offsetWidth;
    N.style.transition="transform .38s cubic-bezier(.16,1,.3,1),opacity .3s";N.style.transform="";N.style.opacity=""},200);
}
function slider(host,getT,canGo,commit){
  let x0=null,y0=0,t0=0,dx=0,mode=null,T=null,lastX=0,lastT=0,vx=0;
  host.addEventListener("touchstart",e=>{if(e.touches.length>1||e.target.closest(".lchips,.chips,.nbw,.search")){x0=null;return}const t=e.touches[0];x0=lastX=t.clientX;y0=t.clientY;t0=lastT=performance.now();mode=null;dx=0;vx=0;T=getT()},{passive:true});
  host.addEventListener("touchmove",e=>{if(x0===null||!T)return;const t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;
    if(!mode){if(Math.abs(mx)<7&&Math.abs(my)<7)return;mode=Math.abs(mx)>Math.abs(my)*1.15?"x":"y";if(mode==="x")T.style.transition="none"}
    if(mode!=="x")return;const now=performance.now();vx=(t.clientX-lastX)/Math.max(1,now-lastT);lastX=t.clientX;lastT=now;
    dx=mx;const d=dx<0?1:-1;const k=canGo(d)?1:.25;T.style.transform=`translate3d(${dx*k}px,0,0)`;T.style.opacity=String(1-Math.min(Math.abs(dx)/(innerWidth*1.6),.3))},{passive:true});
  const end=()=>{if(x0===null)return;x0=null;if(mode!=="x"||!T)return;const d=dx<0?1:-1;
    if(canGo(d)&&(Math.abs(dx)>innerWidth*.2||(Math.abs(vx)>.35&&Math.abs(dx)>24&&Math.sign(vx)===Math.sign(dx))))slideGo(T,d,commit);
    else{T.style.transition="transform .35s cubic-bezier(.16,1,.3,1),opacity .3s";T.style.transform="";T.style.opacity=""}};
  host.addEventListener("touchend",end,{passive:true});host.addEventListener("touchcancel",end,{passive:true});
}
function wardCommit(d){const i=WARDS.indexOf(state.ward);state={view:"list",ward:WARDS[(i+d+10)%10],f:state.f,q:""};render();scrollTo(0,0);return $(".field")}
function goWard(w,d){if($(".field")&&state.ward){const i=WARDS.indexOf(state.ward);slideGo($(".field"),d,()=>{state={view:"list",ward:w,f:state.f,q:""};render();scrollTo(0,0);return $(".field")})}else{state={view:"list",ward:w,f:state.f,q:""};render()}}
slider(document.getElementById("app"),()=>state.view==="list"&&state.ward&&!document.querySelector(".ov")?$(".field"):null,()=>true,wardCommit);
document.addEventListener("click",e=>{

  else if(b.dataset.lf!==undefined){state.f=b.dataset.lf;render()}
  else if(b.id==="back"){state={view:"home",ward:"",f:"",q:""};render()}
  else if(b.dataset.ci){openTeam(+b.dataset.ci)}
  else if(b.dataset.nw){const i=WARDS.indexOf(state.ward),j=WARDS.indexOf(b.dataset.nw);goWard(b.dataset.nw,(j-i+10)%10===1?1:-1)}
});
document.addEventListener("submit",e=>{if(e.target.id==="sf"){e.preventDefault();const q=$("#q").value.trim();if(q){state={view:"list",ward:"",f:"",q};render();scrollTo(0,0)}}});
render();
