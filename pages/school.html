<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小学校・中学校マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--ink:#4a3f3a;--muted:#8a7d76;--line:#efe4d8;--bg:#fffaf3;--card:#fff;--ac:#7a6cf0;--soft:#efeaff;
  --fd:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;--fb:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.65 var(--fb);word-break:auto-phrase;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.hero{position:relative;overflow:hidden;padding:22px 16px 18px;margin:0 -16px 12px;background:linear-gradient(140deg,var(--h1),var(--h2) 55%,#fff6d8)}
.hero .bub{position:absolute;border-radius:50%;opacity:.5}
.hrow{position:relative;display:flex;gap:12px;align-items:center}
.hic{flex:0 0 auto;width:74px;height:74px;border-radius:24px;display:grid;place-items:center;background:#fff;box-shadow:0 8px 20px -10px rgba(90,60,140,.4);transform:rotate(-4deg)}
.hic svg{width:58px;height:58px}
.hero h1{margin:0;font:400 clamp(21px,6vw,27px)/1.3 var(--fd)}
.hero p{margin:4px 0 0;font-size:13px;color:#6f6290}
.talk{display:flex;gap:8px;align-items:flex-end;margin:12px 0 4px}.talk img{width:54px;flex:0 0 auto;animation:sw 3.6s ease-in-out infinite;transform-origin:50% 90%}
.talk p{position:relative;flex:1;margin:0;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-size:13px;font-weight:700;line-height:1.6}
.talk p::before{content:"";position:absolute;left:-8px;bottom:14px;width:12px;height:12px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs a{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:999px;font-weight:900;border:2px solid var(--line);background:#fff}
.tabs a.on{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 70%,#000)}
.mapbox{position:relative;margin:0 -16px;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
#map{position:relative;isolation:isolate;height:clamp(380px,112vw,620px);background:#fbf6ef}
.mtools{position:absolute;left:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:6px}
.mtools button{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.92);font-size:12.5px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.mtools button[aria-pressed="true"]{background:var(--ac);color:#fff}.mtools svg{flex:0 0 auto}
.mtools i{width:12px;height:12px;border-radius:4px;display:inline-block;background:var(--k)}
.mload{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:8px 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--muted);margin:6px 0 0}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
h2{font:400 18px/1.3 var(--fd);margin:18px 0 8px}h2 mark{background:linear-gradient(transparent 60%,#fff1a8 60%);color:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips button{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.q{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:#fff;margin:0 0 10px}
.q input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:15px}
.list{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.sc{display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;background:#fff;border:2px solid var(--line);cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
@media(hover:hover){.sc:hover{transform:translateY(-3px);box-shadow:0 10px 22px -14px rgba(90,60,140,.5)}}
.sc:active{transform:scale(.98)}
.sw{flex:0 0 auto;width:14px;align-self:stretch;border-radius:8px;background:var(--c)}
.sc b{display:block;font-size:15px}.sc small{display:block;font-size:12px;color:var(--muted)}
.sc .num{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}.sc .num b{font-size:16px;color:var(--ink)}
.more{display:block;margin:10px auto;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800}
.note{font-size:12px;color:var(--muted);background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px 12px;margin:16px 0}
/* 小窓 */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;padding:10px;background:rgba(60,40,80,0);transition:background .3s}
.ov.on{background:rgba(60,40,80,.35);backdrop-filter:blur(3px)}
.pc{position:relative;width:min(600px,100%);max-height:calc(100dvh - 20px);overflow:auto;border-radius:26px 26px 22px 22px;background:linear-gradient(180deg,#fffdf8,#fbf6ff);padding:18px 16px 16px;
  transform:translateY(40px);opacity:0;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .3s;box-shadow:0 -10px 40px -20px rgba(60,30,100,.6)}
.ov.on .pc{transform:none;opacity:1}
.px{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:2px solid #e3d7ff;background:#fff;color:var(--ac);font-size:22px;font-weight:700}
.pc .eb{margin:0;font-size:11px;letter-spacing:.2em;font-weight:900;color:var(--ac)}
.pc h3{margin:2px 48px 4px 0;font:400 21px/1.3 var(--fd)}
.pc .ad{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.stats div{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center}
.stats b{display:block;font:400 20px/1.2 var(--fd);color:var(--ac)}.stats small{font-size:11px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding:8px 10px 0;background:#fff;border:2px solid var(--line);border-radius:16px;margin:0 0 4px}
.bars div{flex:1;display:grid;justify-items:center;align-content:end;gap:2px;font-size:10.5px;color:var(--muted);height:100%}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#fff))}
.bars b{font-size:11px;color:var(--ink)}
.sub{font:400 15px/1.3 var(--fd);margin:14px 0 6px;display:flex;align-items:center;gap:6px}.sub svg{width:26px;height:26px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:999px;border:3px solid #fff;color:#fff;font-weight:900;background:linear-gradient(110deg,#FF5FA2,#8E6BF5);box-shadow:0 5px 0 #7B35C9;margin:6px 0}
.uni{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-size:13px}
.uni a{font-weight:800;color:var(--ac)}
.gch{display:flex;gap:5px;margin:0 -16px 8px;padding:2px 16px 6px;overflow-x:auto;scrollbar-width:none}.gch button{flex:0 0 auto}
.gch button{padding:5px 11px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:12.5px;font-weight:800}
.gch button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.lsn{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.lsn li>div{flex:1;min-width:0;overflow-wrap:anywhere}.lsn li{min-width:0;display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:14px;background:#fff;border:2px solid var(--line)}
.lsn .rk{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;font-size:12px;font-weight:900}
.lsn b{display:block;font-size:13.5px}.lsn small{display:block;font-size:11.5px;color:var(--muted)}
.lsn .kmc{flex:0 0 auto;display:grid;justify-items:end;gap:2px}.lsn .km{font-size:12px;font-weight:800;white-space:nowrap}
.lsn a{font-size:11.5px;font-weight:800;color:var(--ac);white-space:nowrap}
#lmap{position:relative;isolation:isolate;height:230px;border-radius:18px;overflow:hidden;border:2px solid var(--line);margin:0 0 8px}
.pclose{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:999px;background:#5A5AEF;color:#fff;font-size:15px;font-weight:800;box-shadow:0 4px 0 #3D3DC4}
.pin{width:30px;height:38px;border:0;background:none;padding:0}
.pin span{display:grid;place-items:center;width:28px;height:28px;margin:0 auto;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--ac);border:2.5px solid #fff;box-shadow:0 3px 8px rgba(60,30,100,.35)}
.pin span i{transform:rotate(45deg);font-style:normal;color:#fff;font:900 11px/1 system-ui}
#map.far .pin span{width:14px;height:14px;border-width:2px}#map.far .pin i{display:none}#map.far .pin{height:16px}
.pin.on span{background:#FF5FA2;transform:rotate(-45deg) scale(1.3)}
.lpin{width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:var(--c,#8E6BF5);box-shadow:0 2px 5px rgba(0,0,0,.3)}

.tabs a{font-size:14px}
.l4{display:grid;gap:8px;margin:0 0 10px}
.l4c{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:18px;background:#fff;border:2px solid var(--line);border-left:6px solid var(--lc)}
.l4i{flex:0 0 auto;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--lc) 45%,#fff)}.l4i svg{width:40px;height:40px}
.l4c b{display:block;font:400 15px/1.35 var(--fd)}.l4c small{display:block;font-size:12.5px;line-height:1.65;color:#6f6290}
.l4t a{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:800;color:var(--ac)}
.tg{display:inline-block;margin-right:4px;padding:0 7px;border-radius:999px;background:#efe8ff;color:#6B4FD8;font-size:11px;font-weight:800}
.lh2{list-style:none}.lh2 h2{margin:16px 0 2px}
.pin.star span{width:34px;height:34px;background:linear-gradient(150deg,#FFB020,#FF6FA5)}.pin.star{height:44px}
.pin.sp span i{font-size:12px}
/* ===== ジャンル（横スライドの四角いカード。1画面に約2.3枚） ===== */
.gnh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.gnsw{font-size:11.5px;color:var(--muted);font-weight:700}
.gnr{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 20px)/2.3);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 6px;padding:4px 16px 12px;scrollbar-width:none}
.gnr::-webkit-scrollbar{display:none}
.gc{position:relative;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:132px;padding:14px 12px 12px;text-align:left;border-radius:20px;border:2px solid #CFEAFB;background:#fff;box-shadow:0 6px 16px -10px rgba(47,122,168,.45);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.gc:active{transform:scale(.96)}
.gc .gci{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#E3F4FC}.gc .gci svg{width:32px;height:32px}
.gc .gimg{width:100%;aspect-ratio:16/10;border-radius:12px;object-fit:cover;background:#E3F4FC}
.gc b{font:400 15px/1.3 var(--fd);color:#2F7AA8}.gc small{font-size:11.5px;line-height:1.5;color:var(--muted)}
.gc em{position:absolute;right:8px;top:8px;font-style:normal;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;background:#F1EDF7;color:#8A84A0}
.gc.soon{opacity:.7;border-style:dashed}
.favbox{margin:4px 0 8px;padding:10px 12px;border-radius:16px;background:#FFF8E1;border:2px dashed #FFE07A}.favbox b{font-size:13px}
.favbox a,.favbox button{display:inline-block;margin:6px 6px 0 0;padding:5px 11px;border-radius:999px;border:2px solid #FFE07A;background:#fff;font-size:12.5px;font-weight:800;text-decoration:none;color:var(--ink)}
/* ===== 情報ページ（全画面のパネル） ===== */
.gd{position:fixed;inset:0;z-index:60;background:rgba(60,40,80,0);transition:background .3s}
.gd.on{background:rgba(60,40,80,.3)}
.gd-in{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,1,.3,1)}
.gd.on .gd-in{transform:none}
.gd-h{flex:0 0 auto;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px;padding:10px 8px;border-bottom:2px solid #E3F4FC;background:linear-gradient(180deg,#F2FAFF,#fff)}
.gd-h button{width:40px;height:40px;border-radius:50%;border:2px solid #CFEAFB;background:#fff;color:#2F7AA8;font-size:22px;font-weight:900;line-height:1}
.gd-h b{text-align:center;font:400 15.5px/1.3 var(--fd);color:#2F7AA8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd-b{flex:1;overflow:auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.gl{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.gl button{width:100%;display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;border:2px solid #E3F4FC;background:#fff;text-align:left}
.gl .gli{flex:0 0 auto;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#E3F4FC}.gl .gli svg{width:28px;height:28px}
.gl b{display:block;font-size:15px}.gl small{display:block;font-size:12px;color:var(--muted)}.gl i{margin-left:auto;font-style:normal;color:#5AB4E8;font-size:20px}
.gp h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:400 20px/1.35 var(--fd)}.gp h2 svg{flex:0 0 auto;width:34px;height:34px}
.gp .meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.gp .meta span{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:#E3F4FC;color:#2F7AA8}
.gp .lead{margin:0 0 12px;font-size:14px;line-height:1.85}
.gp h3{display:flex;align-items:center;gap:6px;margin:18px 0 8px;font:400 15.5px/1.3 var(--fd);color:#2F7AA8}
.gp h3::before{content:"";width:6px;height:18px;border-radius:3px;background:#5AB4E8}
.gp dl{margin:0;display:grid;gap:0;border-radius:16px;border:2px solid #E3F4FC;overflow:hidden}
.gp dl div{display:grid;grid-template-columns:7.5em 1fr;gap:8px;padding:10px 12px;border-top:1px dashed #DCEFFA}.gp dl div:first-child{border-top:0}
.gp dt{font-weight:900;font-size:13px;color:#2F7AA8}.gp dd{margin:0;font-size:13.5px;line-height:1.7}
@media (max-width:380px){.gp dl div{grid-template-columns:1fr;gap:2px}}
.gp ol.how{margin:0;padding:0;list-style:none;counter-reset:h;display:grid;gap:8px}
.gp ol.how li{position:relative;padding:10px 12px 10px 46px;border-radius:14px;background:#F6FBFF;font-size:13.5px;line-height:1.7;counter-increment:h}
.gp ol.how li::before{content:counter(h);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#5AB4E8;color:#fff;font-weight:900;font-size:13px}
.gp .tl{list-style:none;margin:0;padding:0}.gp .tl li{position:relative;display:grid;grid-template-columns:7.2em 1fr;gap:10px;padding:0 0 12px 0}
.gp .tl li b{font-size:12.5px;color:#fff;background:linear-gradient(120deg,#5AB4E8,#8E6BF5);border-radius:10px;padding:4px 8px;align-self:start;text-align:center}
.gp .tl li span{font-size:13.5px;line-height:1.7}
.gp .notes{margin:0;padding:10px 12px 10px 14px;border-radius:14px;background:#FFF8E1;list-style:none;display:grid;gap:6px}.gp .notes li{font-size:13px;line-height:1.7;padding-left:1.2em;text-indent:-1.2em}.gp .notes li::before{content:"！";color:#E0A100;font-weight:900;margin-right:.2em}
.gp .tbl{overflow-x:auto;margin:0 -2px}.gp table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:12.5px;line-height:1.6}
.gp th,.gp td{padding:8px;border-bottom:1px dashed #DCEFFA;vertical-align:top;text-align:left}.gp thead th{background:#E3F4FC;color:#2F7AA8;white-space:nowrap}.gp tbody th{color:#2F7AA8;white-space:nowrap}
.gp .rel{display:flex;flex-wrap:wrap;gap:8px}.gp .rel a,.gp .rel button{display:inline-flex;align-items:center;gap:4px;padding:8px 13px;border-radius:999px;border:2px solid #B5A0E6;background:#F4F0FD;color:#7155BD;font-size:13px;font-weight:900;text-decoration:none;box-shadow:0 3px 0 #B5A0E6}
.gp .rel svg{flex:0 0 auto;width:18px;height:18px}
.gp .rel .soonb{border-style:dashed;box-shadow:none;opacity:.75}
.gp .tel{display:grid;gap:6px}.gp .tel div{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:9px 12px;border-radius:14px;background:#FDF0F5;font-size:13px;font-weight:700}
.gp .tel a{padding:6px 12px;border-radius:999px;background:#fff;border:2px solid #EF9FB5;color:#C4547A;font-weight:900;text-decoration:none;white-space:nowrap}
.gp .src{display:grid;gap:4px}.gp .src a{font-size:12.5px;font-weight:800;color:#2F7AA8}.gp .src span{font-size:12.5px;color:var(--muted)}
.gp .foot{margin-top:16px;padding:10px 12px;border-radius:14px;background:#F6F6FA;font-size:12px;color:var(--muted);line-height:1.7}
.gp .favb{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:14px 0 0;padding:11px;border-radius:999px;border:2px solid #FFE07A;background:#FFF8E1;font-weight:900}
.gp .favb[aria-pressed="true"]{background:#FFE07A}
.gp .ck{display:grid;gap:6px}.gp .ck label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#F6FBFF;font-size:13.5px;line-height:1.5;cursor:pointer}
.gp .ck input{flex:0 0 auto;width:22px;height:22px;accent-color:#5AB4E8}.gp .ck label:has(input:checked){background:#EAF7EF;text-decoration:line-through;color:var(--muted)}
.gp .ckbar{height:10px;border-radius:999px;background:#E3F4FC;overflow:hidden;margin:0 0 6px}.gp .ckbar i{display:block;height:100%;background:linear-gradient(90deg,#5AB4E8,#8E6BF5)}
.gp .dlv{display:grid;gap:8px}.gp .dlv div{padding:10px 12px;border-radius:16px;border:2px solid #E3F4FC}
.gp .dlv b{display:block;font-size:13.5px;line-height:1.5}.gp .dlv small{display:block;font-size:12px;color:var(--muted);margin:2px 0 6px}
.gp .dlv .st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:900;margin-right:6px}
.st.now{background:#FFE3EC;color:#C4547A}.st.soon{background:#E3F4FC;color:#2F7AA8}.st.end{background:#EFEDF3;color:#8A84A0}
.gp .dlv a,.gp .dlv button{font-size:12px;font-weight:900;color:#7155BD;background:none;border:0;padding:0;margin-right:10px;text-decoration:underline}
.gp details{border-radius:14px;background:#F6FBFF;padding:10px 12px;margin:0 0 6px}.gp summary{font-weight:900;font-size:13.5px;cursor:pointer}.gp details p{margin:6px 0 0;font-size:13px;line-height:1.75}
.toast{position:fixed;left:50%;bottom:90px;z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:999px;background:#2E2B4F;color:#fff;font-size:13px;font-weight:700;transition:.3s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 学校の小窓に足したもの */
