<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家の近くで探す</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--ink:#2E2B4F;--muted:#6B6890;--line:#ECE8F7;--card:#FFFFFF;--bg:#FBF8FF;--pink:#FF6FA5;--blue:#3DB2F2;
  --ac:#FF6FA5;--soft:#FFE3EC;--soft2:#FFF4F8;--font-display:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;--font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F4F2FF;--muted:#B5B3D6;--line:#3A3B62;--card:#26274A;--bg:#1B1C33}}
:root[data-theme="dark"]{--ink:#F4F2FF;--muted:#B5B3D6;--line:#3A3B62;--card:#26274A;--bg:#1B1C33}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.6 var(--font-body);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}

/* ---------- ヒーロー ---------- */
.hero{position:relative;overflow:hidden;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:22px max(16px,env(safe-area-inset-left,0px)) 26px;
  background:radial-gradient(120% 90% at 0% 0%,var(--soft) 0,transparent 60%),radial-gradient(90% 80% at 100% 10%,var(--soft2) 0,transparent 60%),linear-gradient(180deg,var(--soft2),var(--bg));border-bottom-left-radius:36px;border-bottom-right-radius:36px}
.hero .deco{position:absolute;inset:0;pointer-events:none}
.hero .deco span{position:absolute;width:var(--s);height:var(--s);opacity:.55;animation:float 6s ease-in-out infinite;animation-delay:var(--d)}
.hero .deco span svg{width:100%;height:100%}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(8deg)}}
.hrow{position:relative;display:flex;align-items:center;gap:14px}
.hic{flex:0 0 auto;width:84px;height:84px;border-radius:30px;display:grid;place-items:center;background:#fff;border:3px solid #fff;box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 30%,transparent),inset 0 0 0 999px var(--soft)}
.hic svg{width:62px;height:62px;overflow:visible;animation:nicw 3.4s ease-in-out infinite}
@keyframes nicw{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}}
.eyebrow{font:800 11px/1 var(--font-body);letter-spacing:.14em;color:var(--ac)}
h1{margin:4px 0 2px;font:400 clamp(22px,6.4vw,30px)/1.25 var(--font-display);color:var(--ink)}
.hsub{margin:0;font-size:13px;color:var(--muted)}
.hstat{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hstat span{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:#2E2B4F;box-shadow:0 3px 0 rgba(46,43,79,.06)}
.hstat b{font:800 16px/1 system-ui,sans-serif;color:var(--ac)}

/* ---------- 中心・条件 ---------- */
.from{display:flex;align-items:center;gap:8px;margin:6px 0 6px;font-weight:700}
.from .dot{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;box-shadow:0 3px 8px color-mix(in srgb,var(--ac) 40%,transparent)}
.from .dot svg{width:20px;height:20px}
.from small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 6px;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip:active{transform:scale(.94)}
.chips .lab{flex:0 0 auto;align-self:center;font-size:11px;font-weight:800;color:var(--muted);margin-right:2px}

/* ---------- 地図 ---------- */
.mapbox{position:relative;margin:8px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0}
#map{height:clamp(380px,112vw,620px);overflow:hidden;background:linear-gradient(var(--soft2),var(--soft));border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
@media (min-width:860px){.mapbox{margin-inline:0}#map{border-radius:26px;border:2px solid var(--line)}}
#map.swap::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,0) 30%,color-mix(in srgb,var(--soft) 80%,transparent));animation:flash .8s ease forwards}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.mload{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);pointer-events:none}
.mtools{position:absolute;left:10px;top:10px;z-index:3;display:flex;gap:6px}
.mtools button{display:inline-flex;align-items:center;gap:4px;border:2px solid #fff;background:rgba(255,255,255,.94);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;color:#2E2B4F;box-shadow:0 3px 10px rgba(46,43,79,.2);cursor:pointer}
.mtools button svg{width:16px;height:16px}
.mtools button[aria-pressed="true"]{background:#2E2B4F;color:#fff;border-color:#2E2B4F}
.mhint{margin:6px 0 0;font-size:11.5px;color:var(--muted)}
.mw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.3,1,.5,1)}
.mw.shut{grid-template-rows:0fr}
.mw>div{min-height:0}
.mw.shut>div,.mw.anim>div{overflow:hidden}
.tgrow{display:flex;justify-content:flex-end;margin-top:4px}
.tg{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;cursor:pointer}
.pw{width:32px;height:42px;cursor:pointer}
.pin{position:relative;width:32px;height:42px;animation:drop .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--b,0s) + var(--d) * 55ms);filter:drop-shadow(0 2px 2px rgba(46,43,79,.3))}
.pin svg{position:absolute;inset:0;width:32px;height:42px;z-index:0!important}
.pin b{position:absolute;z-index:1;left:0;right:0;top:6px;text-align:center;font:800 12.5px/18px system-ui,sans-serif;color:var(--pc)}
@keyframes drop{0%{opacity:0;transform:translateY(-30px) scale(.5)}60%{opacity:1;transform:translateY(3px) scale(1.05)}100%{opacity:1;transform:none}}
.sh{position:absolute;left:50%;bottom:-3px;width:16px;height:6px;margin-left:-8px;border-radius:50%;background:rgba(46,43,79,.28);animation:shd .6s both;animation-delay:calc(var(--b,0s) + var(--d) * 55ms)}
@keyframes shd{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:none}}
.pw.out .pin,.pw.out .sh{animation:pout .25s forwards}
@keyframes pout{to{opacity:0;transform:translateY(-16px) scale(.4)}}
.home{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#FF6FA5;color:#FF6FA5;border:3px solid #fff;box-shadow:0 3px 8px rgba(46,43,79,.35);animation:drop .5s both}
.home svg{width:24px;height:24px;color:#fff}
.home.guest{background:#9C7BFF;color:#9C7BFF}
.home .ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid currentColor;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.maplibregl-popup-content{border-radius:16px;padding:10px 26px 10px 12px;font-family:var(--font-body);box-shadow:0 6px 18px rgba(46,43,79,.22);color:#2E2B4F}
.maplibregl-popup-close-button{font-size:18px;width:24px;height:24px}
.maplibregl-ctrl-attrib{font-size:10px}
.pp b{display:block;font-size:14px;line-height:1.35}
.pp span{display:block;font-size:11px;color:#6B6890;margin:2px 0 6px}
.pp .bt{display:flex;gap:6px;flex-wrap:wrap}
.pp .bt a,.pp .bt button{border:2px solid #E2E6F3;background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:#2E2B4F;text-decoration:none;cursor:pointer}
.pp .bt button{background:var(--ac);border-color:var(--ac);color:#fff}

/* ---------- 登録のおすすめ ---------- */
.reg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--pink) 10%,var(--card));border:2px dashed color-mix(in srgb,var(--pink) 45%,transparent);font-size:13px;line-height:1.55}
.reg p{margin:0;flex:1 1 200px}
.reg button{border:0;border-radius:999px;background:var(--pink);color:#fff;font-size:13px;font-weight:800;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 rgba(46,43,79,.12)}

/* ---------- 一覧 ---------- */
.lhead{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px}
.lhead h2{margin:0;font:400 18px/1.3 var(--font-display)}
.lhead span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:640px){.list{grid-template-columns:1fr 1fr}}
.card{position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 12px 12px 12px;border-radius:22px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 rgba(46,43,79,.04);cursor:pointer;animation:row .45s both;animation-delay:calc(var(--d) * 30ms);overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--pc)}
.card:hover,.card:focus-visible{border-color:var(--pc);outline:none}
@keyframes row{from{opacity:0;transform:translateY(8px)}}
.cic{grid-row:1/4;position:relative;width:56px;height:56px;border-radius:20px;display:grid;place-items:center;background:var(--soft)}
.cic svg{width:42px;height:42px;overflow:visible}
.card:hover .cic svg{animation:nicw 1s ease-in-out infinite}
.rk{position:absolute;right:-6px;bottom:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:var(--pc);color:#fff;border:2px solid var(--card);font:800 12px/20px system-ui,sans-serif;text-align:center}
.ct{min-width:0;display:flex;align-items:flex-start;gap:8px}
.ct h3{flex:1;min-width:0;margin:0;font-size:15px;line-height:1.35;font-weight:900}
.km{flex:0 0 auto;text-align:right;font:800 14px/1.15 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.km small{display:block;font-size:10px;font-weight:700;color:#D2477A}
.cm{font-size:11.5px;color:var(--muted);line-height:1.45;display:flex;gap:4px;align-items:flex-start}
.cm svg{flex:0 0 auto;width:14px;height:14px;margin-top:1px}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 9px 1px 6px;font-size:11px;font-weight:800;background:var(--tb);color:var(--tc)}
.tag svg{width:14px;height:14px}
.btns{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btns a{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;text-decoration:none}
.btns a svg{width:15px;height:15px}
.btns a.main{background:var(--ac);border-color:var(--ac);color:#fff}
.more{display:flex;justify-content:center;margin:14px 0 0}
.more button{border:2px solid var(--ac);background:var(--card);color:var(--ac);border-radius:999px;padding:8px 22px;font-size:13px;font-weight:800;cursor:pointer}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
.note{margin:22px 0 0;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--ac) 7%,var(--card));font-size:11.5px;line-height:1.7;color:var(--muted)}
.totop{position:fixed;z-index:60;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;align-content:center;width:58px;height:58px;padding:0;border-radius:50%;border:3px solid #fff;cursor:pointer;background:linear-gradient(160deg,#FF8FB8,#9C7BFF);color:#fff;font:800 10px/1.1 var(--font-body);box-shadow:0 6px 16px rgba(46,43,79,.25);opacity:0;transform:translateY(14px) scale(.85);pointer-events:none;transition:opacity .3s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:22px;height:22px;margin-bottom:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <div class="from" id="from"></div>
  <div class="chips" id="areas" aria-label="エリア"></div>
  <div class="chips" id="filters" aria-label="しぼりこみ"></div>
  <div class="tgrow"><button type="button" class="tg" id="tg" aria-expanded="true" aria-controls="mw">地図をとじる ▴</button></div>
  <div class="mw" id="mw"><div>
    <div class="mapbox"><div id="map" role="region" aria-label="地図（立体）"><span class="mload" id="mload">地図をよみこみ中…</span></div>
      <div class="mtools"><button type="button" id="ph" aria-pressed="false"></button></div></div>
    <p class="mhint"><span id="legend"></span>ピンをタップすると名前が出ます。地図は2本の指で動かす・回す・かたむけることができます。</p>
  </div></div>
  <div id="reg"></div>
  <div class="lhead"><h2 id="lt">近い順</h2><span id="lc"></span></div>
  <ol class="list" id="list"></ol>
  <div class="more" id="more"></div>
  <p class="note" id="note"></p>
</div>
<button type="button" class="totop" id="totop" aria-label="いちばん上にもどる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14l6-6 6 6"/><path d="M12 8v12"/></svg>上に<br>もどる</button>
<script>
const svg=(body,vb=64,cls="")=>`<svg viewBox="0 0 ${vb} ${vb}" class="${cls}" aria-hidden="true">${body}</svg>`;

const NO=`stroke="#1F2140" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
const NF=(x,y)=>`<circle cx="${x-3.6}" cy="${y}" r="1.5" fill="#1F2140"/><circle cx="${x+3.6}" cy="${y}" r="1.5" fill="#1F2140"/><path d="M${x-2} ${y+2.6}q2 2 4 0" stroke="#1F2140" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="${x-7}" cy="${y+2.4}" r="1.7" fill="#FF8FB8" opacity=".75"/><circle cx="${x+7}" cy="${y+2.4}" r="1.7" fill="#FF8FB8" opacity=".75"/>`;
const NIC={
  kids:`<circle cx="18" cy="19" r="11" fill="#FFE0C8" ${NO}/><path d="M15 9q3-4 6 0" fill="none" ${NO}/>${NF(18,19)}<path d="M26 22v4a6 6 0 0 0 12 0v-3" fill="none" stroke="#5A5AEF" stroke-width="2.4" stroke-linecap="round"/><circle cx="38" cy="21" r="2.6" fill="#FF8FB8" ${NO}/>`,
  tooth:`<path d="M13 8c-5 0-7 4.5-6 9 1 5 2.6 8 3.2 15 .4 3.6 4 3.6 4.6 0L16 26h8l1.2 6c.6 3.6 4.2 3.6 4.6 0 .6-7 2.2-10 3.2-15 1-4.5-1-9-6-9-3.4 0-4.6 1.6-7 1.6S16.4 8 13 8z" fill="#fff" ${NO}/>${NF(20,17)}<path d="M33 4l1 2.4 2.4 1-2.4 1L33 11l-1-2.6-2.4-1 2.4-1z" fill="#35B3EE"/>`,
  ear:`<path d="M12 18a10 10 0 0 1 20 0c0 6-6 7.5-6 13a5 5 0 0 1-10 0" fill="#FFD9C2" ${NO}/><path d="M18 18a4 4 0 0 1 8 0c0 3-3 3.6-3 6.4" fill="none" ${NO}/><path d="M35 12q3 4 0 8M38 9q5 7 0 14" fill="none" stroke="#5A5AEF" stroke-width="2" stroke-linecap="round"/>`,
  eye:`<path d="M3 20s6.5-11 17-11 17 11 17 11-6.5 11-17 11S3 20 3 20z" fill="#fff" ${NO}/><circle cx="20" cy="20" r="7" fill="#7CC4FF" ${NO}/><circle cx="20" cy="20" r="3.4" fill="#1F2140"/><circle cx="22" cy="18" r="1.4" fill="#fff"/><path d="M10 9.5l-2-3M20 7V3.5M30 9.5l2-3" stroke="#1F2140" stroke-width="2" stroke-linecap="round"/>`,
  cream:`<path d="M9 13h18l3 20a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z" fill="#FFB7D8" ${NO} transform="rotate(-12 18 24)"/><rect x="11" y="6" width="10" height="7" rx="2" fill="#A68BFF" ${NO} transform="rotate(-12 18 24)"/>${NF(18,25)}<circle cx="32" cy="10" r="3" fill="#fff" ${NO}/><circle cx="35" cy="17" r="1.8" fill="#fff" ${NO}/>`,
  plaster:`<g transform="rotate(-35 20 20)"><rect x="2" y="13" width="36" height="14" rx="7" fill="#FFD9B8" ${NO}/><rect x="14" y="13" width="12" height="14" fill="#FFF3E8" ${NO}/><circle cx="17.5" cy="17.5" r=".9" fill="#E8B48C"/><circle cx="22.5" cy="17.5" r=".9" fill="#E8B48C"/><circle cx="17.5" cy="22.5" r=".9" fill="#E8B48C"/><circle cx="22.5" cy="22.5" r=".9" fill="#E8B48C"/></g><path d="M31 5l1.4-3M35 9l3-1" stroke="#FF8FB8" stroke-width="2" stroke-linecap="round"/>`,
  bone:`<path d="M10 15a4 4 0 1 1 5-5l10 10a4 4 0 1 1 5 5 4 4 0 1 1-5 5L15 20a4 4 0 1 1-5-5z" fill="#fff" ${NO} transform="rotate(10 20 20)"/>${NF(20,19.5)}`,
  pill:`<g transform="rotate(-40 20 20)"><path d="M20 8h7a8 8 0 0 1 0 16h-7z" fill="#fff" ${NO}/><path d="M20 8h-7a8 8 0 0 0 0 16h7z" fill="#FF8FB8" ${NO}/></g><path d="M29 30l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z" fill="#FFD23F"/><path d="M8 32l.8 1.6 1.6.8-1.6.8-.8 1.6-.8-1.6-1.6-.8 1.6-.8z" fill="#35B3EE"/>`,
  nursery:`<path d="M5 18L20 7l15 11v17H5z" fill="#fff" ${NO}/><path d="M3 19L20 6l17 13" fill="none" stroke="#FF8FB8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 6V1.5l5 1.6-5 1.6" fill="#FFD23F" ${NO}/><rect x="16" y="26" width="8" height="9" rx="3" fill="#A68BFF" ${NO}/><circle cx="12" cy="22" r="2.4" fill="#7CC4FF" ${NO}/><circle cx="28" cy="22" r="2.4" fill="#7CC4FF" ${NO}/>`,
  slide:`<circle cx="33" cy="8" r="4" fill="#FFD23F"/><path d="M8 35V12h6v23" fill="none" ${NO}/><path d="M8 17h6M8 23h6M8 29h6" ${NO}/><path d="M14 12q4 0 8 8t10 15h4" fill="none" stroke="#FF8FB8" stroke-width="4" stroke-linecap="round"/><path d="M14 12q4 0 8 8t10 15h4" fill="none" ${NO} stroke-width="1.2"/><path d="M3 36h34" ${NO}/>`
};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I=(d,extra="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
const IC={
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  sat:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/>',

    e.setAttribute("role","button");e.setAttribute("aria-label",(i+1)+"番 "+r.n);e.title=(i+1)+". "+r.n;
    e.addEventListener("click",ev=>{ev.stopPropagation();openPin(x,i)});
    markers.push(new maplibregl.Marker({element:e,anchor:"bottom"}).setLngLat([r.lo,r.la]).addTo(map))});
  swing=-swing;
  const cam=map.cameraForBounds(b,{padding:{top:60,bottom:20,left:24,right:24},maxZoom:16.5})||{center:[o.ll[1],o.ll[0]],zoom:14};
  const to={center:cam.center,zoom:Math.max(10,(cam.zoom||14)-.05),pitch:55,bearing:swing};
  if(RM)map.jumpTo(to);
  else if(first){
    map.flyTo({center:[o.ll[1],o.ll[0]],zoom:16,pitch:64,bearing:swing*2,duration:2600,curve:1.6,essential:true});
    map.once("moveend",()=>{let done=false;const go=()=>{if(done)return;done=true;setTimeout(()=>map.flyTo({...to,duration:2000,curve:1.3,essential:true}),700)};map.once("idle",go);setTimeout(go,3500)});
  }else map.flyTo({...to,duration:1500,curve:1.5,essential:true});
  first=false;
}
function openPin(x,i){
  if(!map)return;const r=x.r;popup&&popup.remove();
  popup=new maplibregl.Popup({offset:[0,-42],maxWidth:"260px"}).setLngLat([r.lo,r.la])
    .setHTML(`<div class="pp"><b>${i+1}. ${esc(r.n)}</b><span>${esc(r.w)}区 ／ ${kmT(x.km)}（${moveT(x.km)}）${r.h?"<br>"+esc(r.h):""}</span><div class="bt"><a href="${gmap(r)}" target="_blank" rel="noopener">地図・道順 ↗</a>${r.u?`<a href="${esc(url(r.u))}" target="_blank" rel="noopener">HP ↗</a>`:""}</div></div>`).addTo(map);
  const t={center:[r.lo,r.la],zoom:Math.max(map.getZoom(),16),pitch:62};
  RM?map.jumpTo(t):map.easeTo({...t,duration:1100});
}
