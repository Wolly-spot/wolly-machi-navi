<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家の近くで探す</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--ink:#2E2B4F;--muted:#6B6890;--line:#ECE8F7;--card:#FFFFFF;--bg:#FBF8FF;--pink:#FF6FA5;--blue:#3DB2F2;
  --ac:#FF6FA5;--soft:#FFE3EC;--soft2:#FFF4F8;--font-display:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;--font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F4F2FF;--muted:#B5B3D6;--line:#3A3B62;--card:#26274A;--bg:#1B1C33}}
:root[data-theme="dark"]{--ink:#F4F2FF;--muted:#B5B3D6;--line:#3A3B62;--card:#26274A;--bg:#1B1C33}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.6 var(--font-body);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}

/* ---------- ヒーロー ---------- */
.hero{position:relative;overflow:hidden;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:22px max(16px,env(safe-area-inset-left,0px)) 26px;
  background:radial-gradient(70% 60% at 0% 0%,color-mix(in srgb,var(--ac) 22%,transparent) 0,transparent 70%),linear-gradient(125deg,#FFE1EE 0%,#FFF4C7 32%,#DDF1FF 64%,#EADFFF 100%);border-bottom-left-radius:36px;border-bottom-right-radius:36px}
.hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:80px;background:radial-gradient(closest-side,rgba(255,255,255,.75),transparent);pointer-events:none}
.hero .deco{position:absolute;inset:0;pointer-events:none}
.hero .deco span{position:absolute;width:var(--s);height:var(--s);opacity:.9;animation:float 6s ease-in-out infinite;animation-delay:var(--d)}
.hero .deco span svg{width:100%;height:100%}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(8deg)}}
.hrow{position:relative;display:flex;align-items:center;gap:14px}
.hic{flex:0 0 auto;width:88px;height:88px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,var(--soft));border:4px solid #fff;box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 35%,transparent);transform:rotate(-4deg)}
.hic svg{width:62px;height:62px;overflow:visible;animation:nicw 3.4s ease-in-out infinite}
@keyframes nicw{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}}
.eyebrow{font:800 11px/1 var(--font-body);letter-spacing:.14em;color:var(--ac)}
h1{margin:4px 0 2px;font:400 clamp(22px,6.4vw,30px)/1.25 var(--font-display);color:var(--ink)}
.hsub{margin:0;font-size:13px;color:var(--muted)}
.hstat{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hstat span{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:#2E2B4F;box-shadow:0 3px 0 rgba(46,43,79,.06)}
.hstat b{font:800 16px/1 system-ui,sans-serif;color:var(--ac)}

/* ---------- 中心・条件 ---------- */
.from{display:flex;align-items:center;gap:8px;margin:6px 0 6px;font-weight:700}
.from .dot{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;box-shadow:0 3px 8px color-mix(in srgb,var(--ac) 40%,transparent)}
.from .dot svg{width:20px;height:20px}
.from small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 6px;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.chip svg{width:16px;height:16px}
.chip{--cc:var(--ac)}
.chip svg{width:20px;height:20px;overflow:visible}
.chip:not(.on){background:color-mix(in srgb,var(--cc) 9%,var(--card));border-color:color-mix(in srgb,var(--cc) 30%,var(--line))}
.chip.on{background:var(--cc);border-color:var(--cc);color:#fff;box-shadow:0 3px 8px color-mix(in srgb,var(--cc) 40%,transparent)}
.chip:active{transform:scale(.94)}
.chip.pop{animation:chipPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes chipPop{0%{transform:scale(.88)}60%{transform:scale(1.06)}100%{transform:none}}
.chips .lab{flex:0 0 auto;align-self:center;font-size:11px;font-weight:800;color:var(--muted);margin-right:2px}

/* ---------- 地図 ---------- */
.mapbox{position:relative;margin:8px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0}
#map{height:clamp(380px,112vw,620px);overflow:hidden;background:linear-gradient(var(--soft2),var(--soft));border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
@media (min-width:860px){.mapbox{margin-inline:0}#map{border-radius:26px;border:2px solid var(--line)}}
#map.swap::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,0) 30%,color-mix(in srgb,var(--soft) 80%,transparent));animation:flash .8s ease forwards}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.mload{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);pointer-events:none}
.mtools{position:absolute;left:10px;top:10px;z-index:3;display:flex;gap:6px}
.mtools button{display:inline-flex;align-items:center;gap:4px;border:2px solid #fff;background:rgba(255,255,255,.94);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;color:#2E2B4F;box-shadow:0 3px 10px rgba(46,43,79,.2);cursor:pointer}
.mtools button svg{width:16px;height:16px}
.mtools button[aria-pressed="true"]{background:#2E2B4F;color:#fff;border-color:#2E2B4F}
.mhint{margin:6px 0 0;font-size:11.5px;color:var(--muted)}
.mw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.3,1,.5,1)}
.mw.shut{grid-template-rows:0fr}
.mw>div{min-height:0}
.mw.shut>div,.mw.anim>div{overflow:hidden}
.tgrow{display:flex;justify-content:flex-end;margin-top:4px}
.tg{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;cursor:pointer}
.pw{width:32px;height:42px;cursor:pointer}
.pin{position:relative;width:32px;height:42px;animation:drop .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--b,0s) + var(--d) * 55ms);filter:drop-shadow(0 2px 2px rgba(46,43,79,.3))}
.pin svg{position:absolute;inset:0;width:32px;height:42px;z-index:0!important}
.pin b{position:absolute;z-index:1;left:0;right:0;top:6px;text-align:center;font:800 12.5px/18px system-ui,sans-serif;color:var(--pc)}
@keyframes drop{0%{opacity:0;transform:translateY(-30px) scale(.5)}60%{opacity:1;transform:translateY(3px) scale(1.05)}100%{opacity:1;transform:none}}
.sh{position:absolute;left:50%;bottom:-3px;width:16px;height:6px;margin-left:-8px;border-radius:50%;background:rgba(46,43,79,.28);animation:shd .6s both;animation-delay:calc(var(--b,0s) + var(--d) * 55ms)}
@keyframes shd{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:none}}
.pw.out .pin,.pw.out .sh{animation:pout .25s forwards}
@keyframes pout{to{opacity:0;transform:translateY(-16px) scale(.4)}}
.home{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#FF6FA5;color:#FF6FA5;border:3px solid #fff;box-shadow:0 3px 8px rgba(46,43,79,.35);animation:drop .5s both}
.home svg{width:24px;height:24px;color:#fff}
.home.guest{background:#9C7BFF;color:#9C7BFF}
.home .ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid currentColor;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.maplibregl-popup-content{border-radius:16px;padding:10px 26px 10px 12px;font-family:var(--font-body);box-shadow:0 6px 18px rgba(46,43,79,.22);color:#2E2B4F}
.maplibregl-popup-close-button{font-size:18px;width:24px;height:24px}
.maplibregl-ctrl-attrib{font-size:10px}
.pp b{display:block;font-size:14px;line-height:1.35}
.pp span{display:block;font-size:11px;color:#6B6890;margin:2px 0 6px}
.pp .bt{display:flex;gap:6px;flex-wrap:wrap}
.pp .bt a,.pp .bt button{border:2px solid #E2E6F3;background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:#2E2B4F;text-decoration:none;cursor:pointer}
.pp .bt button{background:var(--ac);border-color:var(--ac);color:#fff}

/* ---------- 登録のおすすめ ---------- */
.reg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--pink) 10%,var(--card));border:2px dashed color-mix(in srgb,var(--pink) 45%,transparent);font-size:13px;line-height:1.55}
.reg p{margin:0;flex:1 1 200px}
.reg button{border:0;border-radius:999px;background:var(--pink);color:#fff;font-size:13px;font-weight:800;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 rgba(46,43,79,.12)}

/* ---------- 一覧 ---------- */
.lhead{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px}
.lhead h2{margin:0;font:400 18px/1.3 var(--font-display)}
.lhead span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:640px){.list{grid-template-columns:1fr 1fr}}
.card{position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 12px 12px 14px;border-radius:24px;background:linear-gradient(150deg,var(--cb) 0%,var(--card) 70%);border:2px solid color-mix(in srgb,var(--pc) 28%,var(--line));box-shadow:0 4px 0 rgba(46,43,79,.04);cursor:pointer;animation:row .45s both;animation-delay:calc(var(--d) * 30ms);overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--pc)}
.card:hover,.card:focus-visible{border-color:var(--pc);outline:none}
@keyframes row{from{opacity:0;transform:translateY(8px)}}
.cic{grid-row:1/4;position:relative;width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:#fff;border:3px solid color-mix(in srgb,var(--pc) 35%,#fff);box-shadow:0 4px 10px color-mix(in srgb,var(--pc) 22%,transparent)}
.cic svg{animation:nicw 3.6s ease-in-out infinite;animation-delay:calc(var(--d) * -.4s)}
.cic svg{width:42px;height:42px;overflow:visible}
.card:hover .cic svg{animation:nicw 1s ease-in-out infinite}
.rk{position:absolute;right:-6px;bottom:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:var(--pc);color:#fff;border:2px solid var(--card);font:800 12px/20px system-ui,sans-serif;text-align:center}
.ct{min-width:0;display:flex;align-items:flex-start;gap:8px}
.ct h3{flex:1;min-width:0;margin:0;font-size:15px;line-height:1.35;font-weight:900}
.km{flex:0 0 auto;text-align:right;font:800 14px/1.15 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.km small{display:block;font-size:10px;font-weight:700;color:#D2477A}
.cm{font-size:11.5px;color:var(--muted);line-height:1.45;display:flex;gap:4px;align-items:flex-start}
.cm svg{flex:0 0 auto;width:14px;height:14px;margin-top:1px}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 9px 1px 6px;font-size:11px;font-weight:800;background:var(--tb);color:var(--tc)}
.tag svg{width:17px;height:17px;overflow:visible}
.url{grid-column:1/-1;display:flex;align-items:center;gap:4px;min-width:0;margin-top:2px;font-size:11.5px;font-weight:700;color:color-mix(in srgb,var(--pc) 75%,var(--ink));text-decoration:none}
.url svg{flex:0 0 auto;width:14px;height:14px}
.url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-underline-offset:2px}
.btns{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btns a{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;text-decoration:none}
.btns a svg{width:15px;height:15px}
.btns a.main{background:var(--ac);border-color:var(--ac);color:#fff}
.more{display:flex;justify-content:center;margin:14px 0 0}
.more button{border:2px solid var(--ac);background:var(--card);color:var(--ac);border-radius:999px;padding:8px 22px;font-size:13px;font-weight:800;cursor:pointer}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
/* 10区の絵の地図（あずかりマップと同じ形） */
.wardsec{margin-top:8px}
.wcard{background:linear-gradient(160deg,#FFF6FB,#F1F8FF 60%,#FFFBEA);border:3px solid #fff;border-radius:30px;padding:8px 8px 12px;box-shadow:0 6px 18px rgba(46,43,79,.08)}
#wmap{display:block;width:100%;max-width:520px;margin:0 auto;height:auto}
.ward{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:wpop .7s cubic-bezier(.3,1.6,.5,1) both;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.ward path{stroke:#fff;stroke-width:5;stroke-linejoin:round;transition:opacity .2s}
.ward:hover{transform:translateY(-5px)}
.ward.on{transform:translateY(-8px) scale(1.04)}
.ward.on path{stroke:#2E2B4F;stroke-width:4}
.ward.dim path{opacity:.35}
@keyframes wpop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
.wl{pointer-events:none}
.wl rect{fill:#fff;stroke:#2E2B4F;stroke-width:2}
.wl text{fill:#2E2B4F;font-family:var(--font-body);font-weight:900;font-size:16px;text-anchor:middle}
.wl .cnt{font-family:var(--font-display);font-weight:400;font-size:14px;fill:var(--ac)}
.whint{text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);margin:2px 0 0}
.note{margin:22px 0 0;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--ac) 7%,var(--card));font-size:11.5px;line-height:1.7;color:var(--muted)}
.totop{position:fixed;z-index:60;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;align-content:center;width:58px;height:58px;padding:0;border-radius:50%;border:3px solid #fff;cursor:pointer;background:linear-gradient(160deg,#FF8FB8,#9C7BFF);color:#fff;font:800 10px/1.1 var(--font-body);box-shadow:0 6px 16px rgba(46,43,79,.25);opacity:0;transform:translateY(14px) scale(.85);pointer-events:none;transition:opacity .3s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:22px;height:22px;margin-bottom:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 見やすいタッチ（「歯科健診のくわしい案内」と同じ）。色はジャンルごとに --base / --dk / --lt ===== */
@media not (prefers-color-scheme:dark){:root:not([data-theme="dark"]){--ink:#4a3f3a;--muted:#7d706a;--line:#efe4d8;--bg:#fffaf3;--card:#fff}}
:root[data-theme="light"]{--ink:#4a3f3a;--muted:#7d706a;--line:#efe4d8;--bg:#fffaf3;--card:#fff}
.hero{background:var(--bg)!important}
.hero::before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:var(--lt);top:-80px;left:-70px;filter:blur(2px)}
.hero::after{content:"";position:absolute;left:auto;right:-50px;top:10px;bottom:auto;width:180px;height:180px;border-radius:50%;background:#fff3cf;filter:blur(2px)}
.hero .deco{z-index:1}.hero .deco span{opacity:.55}
.hrow,.hstat{z-index:2}
.hic{background:var(--lt);border:4px solid #fff;box-shadow:0 10px 30px rgba(120,90,60,.10);transform:none}
.eyebrow{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:10.5px;color:var(--muted);letter-spacing:.12em}
h1 .mk{background:linear-gradient(transparent 62%,#ffe7a3 62%)}
.hstat span{background:#fff;border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.hstat b{color:var(--dk)}
.from .dot{background:var(--base);box-shadow:0 3px 0 var(--dk)}
.chip:not(.on){background:#fff!important;border-color:var(--line)!important;color:var(--ink)}
.chip.on{background:var(--base)!important;border-color:var(--base)!important;color:#fff;box-shadow:0 3px 0 var(--dk)!important}
.chips .lab{color:var(--muted)}
.tg{border-color:var(--base);color:var(--dk);background:#fff;box-shadow:0 3px 0 var(--base)}
.wcard{background:#fff;border:3px solid var(--lt);box-shadow:0 10px 30px rgba(120,90,60,.08)}
.reg{background:var(--lt);border:2px dashed var(--base);color:var(--ink)}
.reg button{background:var(--base);box-shadow:0 4px 0 var(--dk)}
.lhead{scroll-margin-top:14px}
.lhead h2 span,.lhead h2{color:var(--ink)}
.lhead h2{background:linear-gradient(transparent 62%,#ffe7a3 62%);padding:0 2px}
.card{background:#fff;border:3px solid var(--lt);box-shadow:0 10px 30px rgba(120,90,60,.08);border-radius:26px}
.card::before{display:none}
.card:hover,.card:focus-visible{border-color:var(--base)}
.cic{background:var(--lt);border:0;box-shadow:none}
.rk{background:var(--dk);border-color:#fff}
.ct h3{color:var(--ink)}
.km{color:var(--ink)}
.km small{color:var(--dk)}
.cm{color:var(--muted)}
.tags{border-top:2px dashed var(--line);padding-top:8px;margin-top:6px}
.tag{background:var(--lt)!important;color:var(--dk)!important}
.url{color:var(--dk)}
.btns a{background:#fff;border:2px solid var(--base);color:var(--dk);box-shadow:0 3px 0 var(--base);transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s}
.btns a.main{background:var(--base);border-color:var(--base);color:#fff;box-shadow:0 4px 0 var(--dk)}
.btns a:active{transform:translateY(2px);box-shadow:0 1px 0 var(--dk)}
.more button{border-color:var(--base);color:var(--dk);background:#fff;box-shadow:0 3px 0 var(--base)}
.note{background:#fff;border:2px dashed var(--line)}
.totop{background:var(--base);box-shadow:0 4px 0 var(--dk),0 8px 18px rgba(0,0,0,.08)}
.pp .bt button{background:var(--base);border-color:var(--base)}

/* ===== 種類ごとの色（全ジャンル共通のルール）=====
   背景・カードのふち・番号はジャンルの色。ボタンとバッジは「何の情報か」で色を決め、どのページでも同じ色にする。
   ボタン：地図・道順＝水色／ホームページ＝ラベンダー／電話・口コミ＝ローズ
   バッジ：土曜＝青／日曜・祝日＝ピンク／夜＝夜空の藍／病院＝グレイッシュブルー／小児（子ども）＝たまご色／内科（おとな）＝ブルーグリーン／矯正＝ふじ色／大きな公園＝さくら色 */
:root{--map:#76b6dc;--map-d:#2f7aa8;--map-l:#e9f4fb;--web:#b5a0e6;--web-d:#7155bd;--web-l:#f4f0fd;--tel:#ef9fb5;--tel-d:#c4547a;--tel-l:#fdeef3}
.btns a.b-map{background:var(--map);border-color:var(--map);color:#fff;box-shadow:0 4px 0 var(--map-d)}
.btns a.b-web{background:var(--web-l);border-color:var(--web);color:var(--web-d);box-shadow:0 3px 0 var(--web)}
.btns a.b-tel{background:var(--tel-l);border-color:var(--tel);color:var(--tel-d);box-shadow:0 3px 0 var(--tel)}

.url{color:var(--web-d)}
.pp .bt a.b-map{background:var(--map);border-color:var(--map);color:#fff}
.pp .bt a.b-web{background:var(--web-l);border-color:var(--web);color:var(--web-d)}
.t-sat{--tl:#e6f1fb;--td:#2f74b5}
.t-sun{--tl:#fde9ef;--td:#c44d72}
.t-night{--tl:#ecebfa;--td:#4a47a3}
.t-hosp{--tl:#edf1f5;--td:#4b6180}
.t-kid{--tl:#fff3cc;--td:#94700a}
.t-adult{--tl:#e2f3f4;--td:#22808a}
.t-brace{--tl:#f4ecfb;--td:#8a54af}
.t-big{--tl:#fdeef4;--td:#c0538a}
.tags .tag[class*="t-"]{background:var(--tl)!important;color:var(--td)!important}
.chips .chip[class*="t-"]:not(.on){background:var(--tl)!important;border-color:color-mix(in srgb,var(--td) 22%,#fff)!important;color:var(--td)}
.chips .chip[class*="t-"].on{background:var(--td)!important;border-color:var(--td)!important;color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--td) 70%,#000)!important}

/* キャラのひとこと */
.ntalk{display:flex;align-items:flex-end;gap:8px;margin:12px 0 6px}
.ntalk:empty{display:none}
.ntalk img{flex:0 0 auto;width:46px;height:auto;transform-origin:50% 4%;animation:chSway 3.6s ease-in-out infinite}
.ntalk p{position:relative;flex:1;margin:0;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-size:13px;line-height:1.65;font-weight:700;color:var(--ink)}
.ntalk p::before{content:"";position:absolute;left:-8px;bottom:13px;width:12px;height:12px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@keyframes chSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
/* ===== 施設の小窓（ふわっと半透明） ===== */
.fs{position:fixed;inset:0;z-index:80;display:grid;align-items:end;justify-items:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
.fs-bd{position:absolute;inset:0;background:rgba(74,63,58,.18);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .35s}
.fs-p{position:relative;width:min(560px,100%);max-height:min(82vh,720px);overflow:auto;overscroll-behavior:contain;border-radius:30px;padding:18px 16px 18px;
  background:color-mix(in srgb,#fffaf3 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border:2px solid rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(120,90,60,.22);
  opacity:0;transform:translateY(40px) scale(.96);transition:opacity .4s,transform .55s cubic-bezier(.3,1.4,.5,1)}
.fs.on .fs-bd{opacity:1}.fs.on .fs-p{opacity:1;transform:none}
.fs-x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.fs-h{display:flex;align-items:center;gap:12px;padding-right:44px}
.fs-ic{flex:0 0 auto;width:64px;height:64px;border-radius:22px;background:var(--lt);display:grid;place-items:center;border:3px solid #fff}
.fs-ic svg{width:46px;height:46px;overflow:visible;animation:nicw 3.4s ease-in-out infinite}
.fs-h h3{margin:0;font-size:17px;line-height:1.35;font-weight:900;color:var(--ink)}
.fs-h small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.fs-km{display:inline-flex;gap:6px;align-items:baseline;margin-top:4px;font:800 14px/1 system-ui,sans-serif;color:var(--ink)}
.fs-km i{font-style:normal;font-size:11px;color:var(--dk)}
.fs-dl{margin:14px 0 0;border-top:2px dashed var(--line)}
.fs-dl>div{display:grid;grid-template-columns:5em 1fr;gap:8px;padding:9px 2px;border-bottom:2px dashed var(--line);font-size:13px;line-height:1.6}
.fs-dl dt{font-weight:800;color:var(--dk)}
.fs-dl dd{margin:0;color:var(--ink);word-break:break-word}
.fs-dl dd a{color:var(--web-d)}
.fs .tags{border-top:0;padding-top:0;margin-top:12px}
.fs .btns{margin-top:12px}
.fs-rv{margin-top:16px;padding:14px;border-radius:22px;background:rgba(255,255,255,.75);border:2px dashed var(--tel)}
.fs-rv h4{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:14px;font-weight:900;color:var(--tel-d)}
.fs-rv h4 svg{width:26px;height:26px;overflow:visible}
.fs-rv p{margin:0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.fs-st{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.fs-st button{display:inline-flex;align-items:center;gap:5px;padding:5px 12px 5px 7px;border-radius:999px;background:#fff;border:2px solid var(--tel);color:var(--tel-d);font-size:12.5px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--tel);transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .2s}
.fs-st button svg{width:20px;height:20px;overflow:visible}
.fs-st button b{font:800 12px/1 system-ui,sans-serif;min-width:20px;padding:3px 6px;border-radius:999px;background:var(--tel-l);color:var(--tel-d);text-align:center}
.fs-st button[aria-pressed="true"]{background:var(--tel);color:#fff;box-shadow:0 3px 0 var(--tel-d)}
.fs-st button[aria-pressed="true"] b{background:#fff}
.fs-st button:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 var(--tel)}
.fs-st button.pop{animation:chipPop .5s cubic-bezier(.3,1.6,.5,1)}
.fs-st button[disabled]{opacity:.6;cursor:wait}
.fs-msg{margin:8px 0 0;font-size:12px;font-weight:700;color:var(--tel-d);min-height:1em}
.stsum{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.stsum span{display:inline-flex;align-items:center;gap:3px;padding:1px 9px 1px 5px;border-radius:999px;background:var(--tel-l);color:var(--tel-d);font-size:11px;font-weight:800}
.stsum span svg{width:16px;height:16px;overflow:visible}
.stsum b{font:800 11px/1 system-ui,sans-serif}
.fs-st span{display:inline-flex;align-items:center;gap:4px;padding:3px 11px 3px 6px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:12px;font-weight:800;color:#a49a94}
.fs-st span svg{width:18px;height:18px;opacity:.75}
.fs-st b{font:800 10px/1 system-ui;background:var(--line);color:var(--muted);border-radius:999px;padding:3px 6px;margin-left:2px}
.fs-rv .btns{margin-top:10px}
.fs-go{display:block;width:100%;margin-top:12px;border:0;border-radius:999px;padding:11px 14px;background:var(--base);color:#fff;font-size:14px;font-weight:900;box-shadow:0 4px 0 var(--dk);cursor:pointer}
body.fs-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){.fs-p,.fs-bd{transition:none}}

.whint{color:#5d6b4a;background:rgba(255,255,255,.8);border-radius:999px;padding:4px 12px;width:fit-content;max-width:100%;margin:4px auto 0}

const WOLLY_API="https://script.google.com/macros/s/AKfycbwv5gVNmYIem_rxce3Zo50cPFtFQ2duU6PqFN61-bjXfDycVBzF3nqpSZwsPaLe26aFSQ/exec";

function naviCall(action,payload){
  if(window.parent!==window)return new Promise(res=>{const req=++reqN;waits[req]=res;window.parent.postMessage({type:"wolly-stamp",req,action,payload},"*");
    setTimeout(()=>{if(waits[req]){delete waits[req];res({ok:false,error:"通信できませんでした。もう一度押してください。"})}},20000)});
  if(action!=="stampCounts")return Promise.resolve({ok:false,code:"noline",error:"スタンプは、LINEの中で開くと押せます。"});
