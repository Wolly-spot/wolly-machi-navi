<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>wolly街ナビ</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>wolly街ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: quiet cool-white app shell so the tall, colourful cards carry the personality. Splash → greeting → chat invite → near-home card → 3 news → horizontal rows of tall covers (kids / clinics / lessons / parks / shops) → floating tab bar. Glass sheets float up for news and near-home. */
:root{
  --bg:#F6F6FC; --surface:#FFFFFF; --ink:#1F2140; --muted:#676A88; --line:#E3E4F0;
  --accent:#5A5AEF; --accent-ink:#FFFFFF; --accent-soft:#ECECFF; --pink:#FF6FAE; --sky:#35B3EE; --lemon:#FFD23F; --lav:#A68BFF; --alert:#E0475B;
  --glass:rgba(255,255,255,.56); --glass-line:rgba(255,255,255,.75); --scrim:rgba(20,22,60,.06);
  --splash-bg:#FBFBFF; --splash-glow:rgba(150,140,255,.20); --petal:#FF9CC8; --logo-filter:none;
  --shadow:0 18px 40px -24px rgba(30,30,90,.45);
  --f-display:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --radius:18px; --tabbar:70px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121328; --surface:#1C1E38; --ink:#EEEFFC; --muted:#A4A7C8; --line:#2E3154;
  --accent:#8F8FFF; --accent-ink:#121328; --accent-soft:#272A50; --pink:#FF86BC; --sky:#5FC4F5; --lemon:#FFD95E; --lav:#B9A3FF; --alert:#FF6B7E;
  --glass:rgba(28,30,56,.58); --glass-line:rgba(255,255,255,.09); --scrim:rgba(0,0,0,.2);
  --splash-bg:#111226; --splash-glow:rgba(140,130,255,.16); --petal:#FF86BC; --logo-filter:invert(.94);
  --shadow:0 18px 40px -24px rgba(0,0,0,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121328; --surface:#1C1E38; --ink:#EEEFFC; --muted:#A4A7C8; --line:#2E3154;
  --accent:#8F8FFF; --accent-ink:#121328; --accent-soft:#272A50; --pink:#FF86BC; --sky:#5FC4F5; --lemon:#FFD95E; --lav:#B9A3FF; --alert:#FF6B7E;
  --glass:rgba(28,30,56,.58); --glass-line:rgba(255,255,255,.09); --scrim:rgba(0,0,0,.2);
  --splash-bg:#111226; --splash-glow:rgba(140,130,255,.16); --petal:#FF86BC; --logo-filter:invert(.94);
  --shadow:0 18px 40px -24px rgba(0,0,0,.85); color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;overflow-x:hidden}
body.is-loading,body.sheet-open{overflow:hidden}
img{display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ============ SPLASH ============ */
/* ============ SPLASH ============ */
.splash{position:fixed;inset:0;z-index:100;background:var(--splash-bg);display:grid;place-items:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  overflow:hidden;clip-path:circle(150% at 50% 50%);transition:clip-path 1s cubic-bezier(.7,0,.25,1)}
.splash.is-out{clip-path:circle(0% at 50% 46%)}
.splash::before{content:"";position:absolute;inset:-20%;
  background:radial-gradient(closest-side at 50% 44%,var(--splash-glow),transparent 70%);
  opacity:0;animation:glow 2.4s ease-out .1s forwards}
@keyframes glow{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
.drift{position:absolute;inset:0;pointer-events:none}
.drift i{position:absolute;bottom:-40px;width:var(--s);height:calc(var(--s)*1.6);background:var(--petal);opacity:0;
  border-radius:0 100% 0 100%;animation:rise var(--d) linear var(--delay) infinite}
@keyframes rise{0%{opacity:0;transform:translate3d(0,0,0) rotate(var(--r))}15%{opacity:.35}85%{opacity:.25}
  100%{opacity:0;transform:translate3d(var(--x),-115vh,0) rotate(calc(var(--r) + 140deg))}}

.stage{position:relative;display:grid;justify-items:center;gap:clamp(20px,4vh,40px);z-index:1}
.logo{position:relative;width:min(68vw,46vh,420px);aspect-ratio:828/915;max-width:100%}
.logo img{position:absolute;inset:0;width:100%;height:100%;filter:var(--logo-filter);user-select:none;-webkit-user-drag:none}
/* gecko: soft ink-like emergence — branch first, then body, then tail, while focus sharpens */
.l-emblem{opacity:0;transform-origin:50% 8%;
  -webkit-mask-image:linear-gradient(180deg,#000 38%,rgba(0,0,0,.35) 50%,transparent 62%);mask-image:linear-gradient(180deg,#000 38%,rgba(0,0,0,.35) 50%,transparent 62%);
  -webkit-mask-size:100% 260%;mask-size:100% 260%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:0 100%;mask-position:0 100%;
  animation:emerge 2.3s cubic-bezier(.33,.0,.15,1) .25s forwards, focus 2.6s cubic-bezier(.25,.6,.2,1) .25s forwards, sway 5.5s ease-in-out 2.9s infinite}
@keyframes emerge{
  0%{opacity:0;-webkit-mask-position:0 100%;mask-position:0 100%;transform:translateY(14px)}
  25%{opacity:1}
  100%{opacity:1;-webkit-mask-position:0 0;mask-position:0 0;transform:translateY(0)}}
@keyframes focus{
  0%{filter:var(--logo-filter) blur(9px) drop-shadow(0 0 0 transparent)}
  55%{filter:var(--logo-filter) blur(1.5px) drop-shadow(0 10px 18px rgba(40,80,40,.18))}
  100%{filter:var(--logo-filter) blur(0) drop-shadow(0 6px 10px rgba(40,80,40,.08))}}
@keyframes sway{0%,100%{rotate:0deg}50%{rotate:1deg}}
/* lettering: written left to right */
.l-text,.l-swash{-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 55%);mask-image:linear-gradient(90deg,#000 45%,transparent 55%);
  -webkit-mask-size:240% 100%;mask-size:240% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.l-text{animation:write 1.5s cubic-bezier(.5,.1,.35,1) 1.85s forwards}
.l-swash{animation:write 1s cubic-bezier(.4,0,.2,1) 3.05s forwards}
@keyframes write{to{-webkit-mask-position:0 0;mask-position:0 0}}

.loader{display:grid;justify-items:center;gap:8px;opacity:0;animation:fade-up .7s ease-out 1.2s forwards}
.bar{width:min(42vw,160px);height:2px;background:color-mix(in srgb,var(--ink) 12%,transparent);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.loader small{font-size:11px;letter-spacing:.32em;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:.32em}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stage.is-leaving .logo{transition:transform .7s cubic-bezier(.6,0,.3,1),opacity .6s ease,filter .6s ease;transform:translateY(-3vh) scale(1.06);opacity:0;filter:blur(8px)}
.stage.is-leaving .loader{transition:opacity .3s;opacity:0}
.skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:calc(env(safe-area-inset-right,0px) + 20px);z-index:2;
  background:none;border:0;padding:8px 4px;font:500 12px/1 var(--f-body);letter-spacing:.24em;color:var(--muted);cursor:pointer;
  opacity:0;animation:fade-up .5s ease-out .6s forwards;transition:color .2s}
.skip:hover{color:var(--ink)}
.skip::after{content:"";display:block;height:1px;margin-top:6px;background:currentColor;transform:scaleX(.35);transform-origin:right;transition:transform .25s}
.skip:hover::after{transform:scaleX(1)}


/* ============ APP SHELL ============ */
.page{opacity:0;transform:translateY(16px);transition:opacity .8s ease .15s,transform .9s cubic-bezier(.2,.8,.2,1) .15s;
  padding-bottom:calc(var(--tabbar) + 40px + env(safe-area-inset-bottom,0px))}
body.is-ready .page{opacity:1;transform:none}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;min-height:60px}
.back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;
  flex:none;transition:transform .25s,opacity .25s,width .25s,margin .25s,border-color .2s}
.back svg{width:18px;height:18px}
.back:hover{border-color:var(--accent)}
.back[hidden]{display:grid!important;width:0;opacity:0;transform:scale(.6);margin-right:-10px;pointer-events:none;border-width:0}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;min-width:0}
.brand img{height:40px;width:auto;filter:var(--logo-filter)}
.brand b{font:500 18px/1 var(--f-display);white-space:nowrap}
.brand b span{color:var(--accent)}
.top .sp{flex:1}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);text-decoration:none}
.iconbtn:hover{background:var(--accent-soft)}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--alert);border:2px solid var(--bg)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;max-width:46vw;text-decoration:none}
.me span{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me.guest{border-style:dashed}
.me.guest span{color:var(--muted);font-weight:500}

/* cute avatars */
.av{width:32px;height:32px;border-radius:50%;flex:none;display:block;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:68px;height:68px}
.av.none{display:grid;place-items:center;border:1.5px dashed var(--muted);color:var(--muted);background:none}
.av.none svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}

/* views */
.view{display:none}
.view.on{display:block;animation:view-in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes view-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
section.block{padding-block:16px}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
.head h2{font:500 clamp(19px,2.6vw,24px)/1.35 var(--f-display);margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--accent)}
.more{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap;background:none;border:0;cursor:pointer;padding:4px 0}
.rowhint{font-size:12px;color:var(--muted);white-space:nowrap}

/* greeting + members */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:18px}
.hello h1{font:500 clamp(22px,4vw,30px)/1.35 var(--f-display);margin:0}
.hello p{margin:2px 0 0;color:var(--muted);font-size:13px}
.members{display:flex;align-items:center;gap:10px}
.stack{display:flex}
.stack .av{width:30px;height:30px;border:2px solid var(--bg);margin-left:-8px;box-sizing:content-box}
.stack .av:first-child{margin-left:0}
.members small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.reg-banner{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.reg-banner p{margin:0;font-size:13px;flex:1;min-width:0;line-height:1.55}
.reg-banner b{display:block;font-size:14px}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;padding:10px 18px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* chat invite (empty) + ticker (with messages) */
.cta{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;overflow:hidden;text-decoration:none;
  border-radius:24px;padding:18px 18px 18px 16px;color:#2A2230;
  background:linear-gradient(120deg,#FFE0EF 0%,#F1E6FF 50%,#DDF0FF 100%);box-shadow:0 18px 36px -22px rgba(170,110,230,.7);
  transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.cta:hover{transform:translateY(-3px)}
.cta i.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;animation:bub 6s ease-in-out infinite}
.cta i.b1{width:90px;height:90px;right:-20px;top:-30px}
.cta i.b2{width:40px;height:40px;right:70px;bottom:-14px;animation-delay:-2s}
.cta i.b3{width:18px;height:18px;left:42%;top:10px;animation-delay:-4s;background:rgba(255,170,190,.5)}
@keyframes bub{50%{transform:translateY(-8px) scale(1.06)}}
.cta .face{position:relative;width:54px;height:54px;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -10px rgba(120,80,200,.6);animation:nod 3.2s ease-in-out infinite}
.cta .face svg{width:34px;height:34px}
@keyframes nod{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.cta .tx{position:relative;min-width:0}
.cta .tx b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font:500 clamp(16px,3.6vw,19px)/1.4 var(--f-display)}
.cta .tx b em{font:700 11px/1 var(--f-body);font-style:normal;letter-spacing:.06em;color:#fff;background:#7A5CFF;border-radius:999px;padding:4px 9px}
.cta .tx p{margin:6px 0 0;font-size:13px;line-height:1.65;color:#4A3F50}
.cta .go{position:relative;width:38px;height:38px;border-radius:50%;background:#2A2230;color:#fff;display:grid;place-items:center}
.cta .go svg{width:18px;height:18px}
.ticker{display:flex;align-items:center;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit}
.ticker .lbl{flex:none;display:flex;align-items:center;gap:6px;padding:12px 14px;background:linear-gradient(120deg,#FF7FB8,#8F7BFF);color:#fff;font-weight:700;font-size:13px}
.ticker .lbl i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.ticker .track{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ticker .run{display:inline-flex;gap:36px;white-space:nowrap;padding-left:24px;animation:marquee var(--dur,30s) linear infinite}
.ticker:hover .run{animation-play-state:paused}
.ticker .run span{font-size:14px}
.ticker .run small{color:var(--muted);margin-right:6px;font-size:12px}
@keyframes marquee{to{transform:translateX(-50%)}}

/* near-home card */
.near{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;cursor:pointer;
  border-radius:24px;padding:20px;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 95% 0%,rgba(255,220,120,.85),transparent 36%),linear-gradient(130deg,#5A5AEF 0%,#9A6BFF 55%,#FF6FAE 100%);
  box-shadow:0 22px 40px -24px rgba(90,90,239,.9);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.near:hover{transform:translateY(-3px)}
.near.lift{transform:translateY(-10px) scale(1.02);box-shadow:0 34px 50px -26px rgba(90,90,239,.95)}
.near h3{margin:4px 0 6px;font:500 clamp(20px,3vw,24px)/1.35 var(--f-display)}
.near p{margin:0;font-size:13px;opacity:.95;line-height:1.6}
.near .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.near .chips span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4)}
.near .pin{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;animation:bob 2.6s ease-in-out infinite}
.near .pin svg{width:30px;height:30px}
@keyframes bob{50%{transform:translateY(-5px)}}
.near .eb{font-size:11px;letter-spacing:.16em;font-weight:700;opacity:.9}

/* news */
.news{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ni{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none}
.ni:first-child{border-top:0}
.ni:hover{background:var(--accent-soft)}
.ni .nwi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--nb);flex:none}
.ni .nwi svg{width:36px;height:36px;color:inherit;overflow:visible;animation:nicw 3.6s ease-in-out infinite;animation-delay:calc(var(--n,0)*-.5s)}
.ni:hover .nwi svg{animation-duration:.9s}
.ni .tt small{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;margin-top:3px}
.h2sub{font-size:.6em;color:var(--muted);margin-left:2px;white-space:nowrap}
.ni .tg{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.ni .tg.imp{background:color-mix(in srgb,var(--alert) 14%,transparent);color:var(--alert)}
.ni .tt{min-width:0}
.ni .tt b{display:block;font-size:14px;font-weight:500;line-height:1.5}
.ni .tt small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ni svg{width:16px;height:16px;color:var(--muted)}
.news .empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13px}
.stamp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:8px}
.stamp i{width:7px;height:7px;border-radius:50%;background:#3BB273;box-shadow:0 0 0 0 rgba(59,178,115,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(59,178,115,0)}100%{box-shadow:0 0 0 0 rgba(59,178,115,0)}}

/* rows of tall covers */
.row{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(168px,44vw,212px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px max(16px,env(safe-area-inset-left,0px)) 16px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));scrollbar-width:none;overscroll-behavior-x:contain;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
.row::-webkit-scrollbar{display:none}
.tc{scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.cv{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;color:#fff;background:var(--g);box-shadow:0 14px 26px -18px rgba(40,20,30,.7);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;isolation:isolate}
.tc:hover .cv{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 22px 32px -18px rgba(40,20,30,.7)}
.tc:active .cv{transform:translateY(-2px) scale(.98)}
.cv::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--pat,none)}
.cv::after{content:"";position:absolute;inset:auto 0 0;height:46%;z-index:-1;background:linear-gradient(transparent,rgba(0,0,0,.22))}
.cv .tag{position:absolute;left:10px;top:10px;font-size:10px;font-weight:700;letter-spacing:.12em;background:rgba(255,255,255,.92);color:#2A2230;padding:3px 9px;border-radius:999px}
.cv .ward{position:absolute;right:10px;top:10px;font-size:10px;font-weight:700;background:#2A2230;color:#fff;padding:3px 8px;border-radius:999px}
.cv .pic{position:absolute;left:50%;top:42%;translate:-50% -50%;width:56%;aspect-ratio:1;border-radius:50%;background:#FFFDF6;display:grid;place-items:center;box-shadow:0 12px 24px -12px rgba(0,0,0,.45)}
.cv .pic img{width:84%;height:84%;object-fit:contain;mix-blend-mode:multiply}
.cv .pic svg{width:52%;height:52%;fill:none;stroke:var(--ic,#2A2230);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cv .glyph{position:absolute;left:50%;top:40%;translate:-50% -50%;width:50%;height:auto;fill:none;stroke:rgba(255,255,255,.96);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.cv strong{position:absolute;left:12px;right:12px;bottom:12px;font:500 17px/1.35 var(--f-display);text-shadow:0 1px 8px rgba(0,0,0,.3)}
.cv strong small{display:block;font:700 11px/1.4 var(--f-body);opacity:.92;margin-top:2px}
.cv.light{color:#2A2230}
.cv.light strong{text-shadow:none}
.cv.light::after{background:linear-gradient(transparent,rgba(255,255,255,.35))}
.tc > small{font-size:12px;color:var(--muted);line-height:1.45;padding-inline:2px}
.tc:hover .cv .pic{animation:wig .6s ease}
@keyframes wig{30%{rotate:-8deg}65%{rotate:6deg}}

/* chat view */
.chat{display:grid;gap:10px;padding-bottom:120px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:92%}
.msg .bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
.msg .bubble p{margin:0;font-size:14px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
.msg .bubble small{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.msg.mine{margin-left:auto;flex-direction:row-reverse}
.msg.mine .bubble{background:var(--accent-soft);border-radius:16px 4px 16px 16px}
.msg .del{background:none;border:0;color:var(--muted);font-size:11px;cursor:pointer;padding:0;text-decoration:underline}
.compose{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 22px + env(safe-area-inset-bottom,0px));z-index:25;pointer-events:none}
.compose .wrap{pointer-events:auto}
.compose form{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);max-width:720px;margin:0 auto}
.compose textarea{flex:1;min-width:0;border:0;background:none;resize:none;font:inherit;color:var(--ink);outline:none;max-height:120px;padding:7px 0;line-height:1.5}
.compose .send{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.compose .send:disabled{opacity:.4}
.compose .note{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
.compose .gate{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:10px 10px 10px 16px;max-width:720px;margin:0 auto;font-size:13px;box-shadow:var(--shadow)}

/* mypage */
.form{display:grid;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;max-width:640px}
.field{display:grid;gap:6px}
.field label,.field .lab{font-size:13px;font-weight:700}
.field small{font-size:12px;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.icons button{display:grid;justify-items:center;gap:4px;border:2px solid transparent;border-radius:18px;padding:6px 2px;background:none;cursor:pointer;font-size:11px;color:var(--muted);transition:transform .25s cubic-bezier(.3,1.6,.5,1),border-color .2s,background .2s}
.icons button:hover{transform:translateY(-3px)}
.icons button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.icons button[aria-pressed="true"] .av{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{40%{transform:translateY(-6px) scale(1.08)}}
.icons .av{width:52px;height:52px}
.profile-card{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.profile-card b{font:500 20px/1.3 var(--f-display);display:block}
.profile-card small{color:var(--muted);font-size:12px}
.status{font-size:13px;color:var(--accent);min-height:1.4em}

/* glass sheets (news / near home) */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .45s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:min(100%,600px);box-sizing:border-box;max-height:86vh;overflow:auto;overscroll-behavior:contain;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-line);border-bottom:0;border-radius:28px 28px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translate(-50%,46px) scale(.96);opacity:0;filter:blur(8px);pointer-events:none;
  transition:transform .7s cubic-bezier(.16,1,.3,1),opacity .5s ease,filter .55s ease;box-shadow:0 -24px 60px -34px rgba(0,0,0,.5)}
.sheet.on{transform:translate(-50%,0) scale(1);opacity:1;filter:none;pointer-events:auto}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sheet{background:color-mix(in srgb,var(--surface) 94%,transparent)}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:color-mix(in srgb,var(--ink) 25%,transparent);margin:0 auto 12px}
.sheet h3{font:500 22px/1.35 var(--f-display);margin:4px 0}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.sheet .close{position:absolute;top:12px;right:max(14px,env(safe-area-inset-right,0px))}
.sheet .news{background:color-mix(in srgb,var(--surface) 55%,transparent);border-color:var(--glass-line)}
.sheet .ni{opacity:0;transform:translateY(10px);animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--n)*40ms + .12s)}
.sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.sheet .grid a{display:grid;gap:6px;justify-items:start;text-decoration:none;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--glass-line);border-radius:16px;padding:14px;transition:border-color .2s;
  opacity:0;transform:translateY(12px);animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--n)*45ms + .15s)}
.sheet .grid a:hover{border-color:var(--accent)}
.sheet .grid a span{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.sheet .grid a b{font-size:14px}
.sheet .grid a small{font-size:11px;color:var(--muted)}
/* 家の近くで探す：ジャンルのアイコン */
.sheet .grid .nic,.nwide .nic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--nb);color:inherit}
.nic svg{width:40px;height:40px;overflow:visible;animation:nicw 3.4s ease-in-out infinite;animation-delay:calc(var(--n,0)*-.37s)}
.sheet .ngrid a:hover .nic svg{animation-duration:.9s}
@keyframes nicw{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-2px) rotate(-5deg)}60%{transform:translateY(0) rotate(4deg)}}
.nwide{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--glass-line);border-radius:16px;padding:14px;
  opacity:0;transform:translateY(12px);animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--n)*45ms + .15s)}
.nwide>b{font-size:14px;line-height:1.5}
.nsub{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet .nsub a{display:grid;gap:2px;justify-items:center;text-align:center;padding:10px 6px;border-radius:12px;background:color-mix(in srgb,var(--nbg,#FFF1C2) 60%,var(--surface));border:1px solid var(--line);font-weight:700;font-size:13px;line-height:1.35;opacity:1;transform:none;animation:none}
.tabbar a.nearbtn{white-space:nowrap;font-size:9.5px;letter-spacing:-.03em}
@keyframes pop{to{opacity:1;transform:none}}
.sheet .gate{text-align:center;padding:18px 6px 6px}
.sheet .gate .av{margin:0 auto 10px}
.sheet .gate p{color:var(--muted);font-size:13px;margin:0 0 16px}
.sheet .foot{font-size:12px;color:var(--muted);margin:12px 0 0}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;
  width:min(calc(100% - 24px),520px);height:var(--tabbar);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);opacity:0;translate:0 30px;transition:opacity .6s .5s,translate .7s cubic-bezier(.2,.8,.2,1) .5s}
body.is-ready .tabbar{opacity:1;translate:0 0}
.tabbar a{position:relative;display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:700;padding:6px 0}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:-1px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabbar a.chatbtn span.b{width:50px;height:50px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#FF7FB8,#5A5AEF);box-shadow:0 10px 20px -8px rgba(90,90,239,.8);border:4px solid var(--bg)}
.tabbar a.chatbtn span.b svg{width:24px;height:24px}
.tabbar a .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--alert);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

footer{padding-block:28px 10px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
footer img{height:56px;width:auto;filter:var(--logo-filter)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}

@media (min-width:900px){
  .home-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:start}
  .row{grid-auto-columns:200px}
}
@media (max-width:420px){ .brand b{display:none} .cta{grid-template-columns:auto 1fr;}.cta .go{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
  .l-emblem{-webkit-mask:none;mask:none}
  .drift{display:none}
  .ticker .run{animation:none}
}

/* ====== v4 additions ====== */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat{display:grid;justify-items:center;gap:6px;text-align:center;text-decoration:none;padding:14px 6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.cat:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cat .ci{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--cbg)}
.cat .ci svg{width:40px;height:40px}
.cat b{font:500 14px/1.3 var(--f-display)}
.cat small{font-size:11px;color:var(--muted);line-height:1.3}
@media (min-width:720px){.cats{grid-template-columns:repeat(6,minmax(0,1fr))}}
.filt{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 12px;padding:2px max(16px,env(safe-area-inset-left,0px))}
.filt::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec-lead{margin:-6px 0 12px;font-size:13px;color:var(--muted)}
/* money cover */
.cv .big{position:absolute;left:12px;right:12px;top:36%;translate:0 -50%;font:500 clamp(26px,7vw,34px)/1.1 var(--f-display);letter-spacing:-.01em;text-shadow:none}
.cv .big small{display:block;font:700 11px/1.4 var(--f-body);margin-top:6px;opacity:.85}
.cv .mini{position:absolute;right:10px;top:8px;width:40px;height:40px}
.cv .mini svg{width:100%;height:100%}
.cv .state{position:absolute;right:10px;bottom:10px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:#1F2140;color:#fff}
.cv.light .tag{background:rgba(31,33,64,.9);color:#fff}
/* character icon (big, cute) */
.cv .cha{position:absolute;left:50%;top:42%;translate:-50% -50%;width:62%;aspect-ratio:1}
.cv .cha svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 14px rgba(30,30,90,.18))}
/* lesson animated badge */
.cv .ls{position:absolute;left:50%;top:42%;translate:-50% -50%;width:64%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 14px 26px -14px rgba(20,20,70,.55);display:grid;place-items:center}
.cv .ls svg{width:78%;height:78%;overflow:visible}
svg .a-bounce{animation:a-bounce 1.1s cubic-bezier(.5,0,.5,1) infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes a-bounce{0%,100%{transform:translateY(-14px)}50%{transform:translateY(0) scale(1.06,.94)}}
svg .a-shadow{animation:a-shadow 1.1s cubic-bezier(.5,0,.5,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes a-shadow{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1);opacity:.6}}
svg .a-roll{animation:a-roll 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes a-roll{to{transform:rotate(360deg)}}
svg .a-swing{animation:a-swing 1.4s cubic-bezier(.6,0,.3,1) infinite;transform-box:view-box;transform-origin:var(--o,32px 50px)}
@keyframes a-swing{0%,100%{transform:rotate(-38deg)}45%{transform:rotate(30deg)}}
svg .a-fly{animation:a-fly 1.4s cubic-bezier(.4,0,.6,1) infinite;transform-box:fill-box}
@keyframes a-fly{0%,40%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--fx,26px),var(--fy,-22px));opacity:0}}
svg .a-arc{animation:a-arc 1.8s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes a-arc{0%{transform:translate(-14px,8px) rotate(-30deg)}50%{transform:translate(0,-10px) rotate(0)}100%{transform:translate(14px,8px) rotate(30deg)}}
svg .a-wave{animation:a-wave 1.6s linear infinite;transform-box:fill-box}
@keyframes a-wave{to{transform:translateX(-16px)}}
svg .a-bob{animation:a-bob 1.6s ease-in-out infinite;transform-box:fill-box}
@keyframes a-bob{50%{transform:translateY(-4px)}}
svg .a-shake{animation:a-shake .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes a-shake{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
svg .a-spin{animation:a-spin 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes a-spin{0%,30%{transform:scaleX(1)}50%{transform:scaleX(-1)}80%,100%{transform:scaleX(1)}}
svg .a-flip{animation:a-flip 2.2s cubic-bezier(.5,0,.5,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes a-flip{0%,20%{transform:rotate(0)}70%,100%{transform:rotate(360deg)}}
svg .a-press{animation:a-press 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
@keyframes a-press{0%,30%,100%{transform:scaleY(1);fill:#fff}12%{transform:scaleY(.86);fill:#C9C4FF}}
svg .a-slide{animation:a-slide 1.6s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes a-slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
svg .a-draw{stroke-dasharray:120;stroke-dashoffset:120;animation:a-draw 2.4s ease-in-out infinite}
@keyframes a-draw{0%{stroke-dashoffset:120}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
svg .a-pop{animation:a-pop 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes a-pop{0%{opacity:0;transform:scale(.3)}12%,80%{opacity:1;transform:scale(1)}100%{opacity:0}}
svg .a-tilt{animation:a-tilt 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes a-tilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
svg .a-strike{animation:a-strike 1.3s cubic-bezier(.7,0,.3,1) infinite;transform-box:view-box;transform-origin:var(--o,20px 54px)}
@keyframes a-strike{0%,100%{transform:rotate(-55deg)}35%{transform:rotate(10deg)}}
@keyframes a-beads{from{transform:translateY(0)}to{transform:translateY(10px)}}
/* sheet detail blocks */
.dhead{display:flex;gap:14px;align-items:center;margin:2px 44px 14px 0}
.dhead .dic{flex:none;width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:var(--dbg,var(--accent-soft))}
.dhead .dic svg{width:56px;height:56px;overflow:visible}
.dhead h3{margin:2px 0}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.pill.wait{background:color-mix(in srgb,var(--lemon) 35%,transparent);color:var(--ink)}
.price{border-radius:18px;padding:14px 16px;margin-bottom:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--lemon) 55%,var(--surface)),color-mix(in srgb,var(--pink) 25%,var(--surface)))}
.price b{display:block;font:500 30px/1.2 var(--f-display)}
.price span{font-size:13px;color:var(--ink)}
.dl{display:grid;gap:8px;margin:0 0 12px}
.dl div{display:grid;grid-template-columns:4.5em 1fr;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);font-size:14px;line-height:1.6}
.dl dt{font-weight:700;color:var(--accent)}
.dl dd{margin:0;min-width:0}
.note{font-size:13px;line-height:1.7;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--lemon) 25%,transparent);margin:0 0 12px}
.feat{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.feat li{display:flex;gap:8px;font-size:14px;line-height:1.6}
.feat li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px}
.go{display:flex;justify-content:center;align-items:center;gap:6px;width:100%;box-sizing:border-box;text-align:center;border-radius:999px;padding:13px 18px;font-weight:700;font-size:15px;text-decoration:none;color:var(--accent-ink);background:var(--accent);box-shadow:0 12px 22px -14px var(--accent)}
.go.vbtn{border:0;cursor:pointer;font-family:inherit}
.viewer{position:fixed;z-index:80;left:50%;top:max(10px,env(safe-area-inset-top,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:min(calc(100% - 16px),760px);
  display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-line);box-shadow:0 30px 70px -30px rgba(20,20,80,.6);
  transform:translate(-50%,40px) scale(.95);opacity:0;filter:blur(8px);transition:transform .6s cubic-bezier(.16,1,.3,1),opacity .4s ease,filter .45s ease}
.viewer.on{transform:translate(-50%,0) scale(1);opacity:1;filter:none}
.viewer .vbar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;border-bottom:1px solid var(--glass-line)}
.viewer .vbar b{flex:1;min-width:0;font:500 15px/1.4 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .vbody{position:relative;flex:1;background:var(--surface)}
.viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .35s}
.viewer.ready iframe{opacity:1}
.viewer .vload{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.go.sub{background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink);box-shadow:none;border:1px solid var(--line);margin-top:8px}
.wards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 12px}
.wards a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--line);font-weight:700;font-size:14px;line-height:1.4}
.wards a.mine{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wards a small{font-size:11px;font-weight:700;opacity:.8;white-space:nowrap}
.secttl{font:500 16px/1.4 var(--f-display);margin:16px 0 8px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px;counter-reset:s}
.steps li{list-style:none;counter-increment:s;padding:10px 8px;border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);font-size:12.5px;line-height:1.5;text-align:center}
.steps li::before{content:"STEP " counter(s);display:block;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.steps{padding:0}
.dent-tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.dent{display:grid;gap:8px}
.dc{padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--line)}
.dc b{display:block;font-size:15px}
.dc .ad{font-size:12px;color:var(--muted)}
.dc .fl{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.dc .fl span{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.dc .fl span.s{background:color-mix(in srgb,var(--sky) 20%,transparent);color:var(--ink)}
.dc .fl span.u{background:color-mix(in srgb,var(--pink) 22%,transparent);color:var(--ink)}
.dc .row2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px}
.dc .tel{font-weight:700;font-variant-numeric:tabular-nums;user-select:all}
.dc .row2 a{font-weight:700;color:var(--accent);text-decoration:none}
.dc .hrs{font-size:12px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.stats div{padding:10px 8px;border-radius:14px;text-align:center;background:color-mix(in srgb,var(--surface) 72%,transparent)}
.stats b{display:block;font:500 18px/1.2 var(--f-display)}
.stats small{font-size:11px;color:var(--muted)}
.ptopic{padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--surface) 72%,transparent);margin:0 0 8px}
.ptopic b{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:4px}
.ptopic ul{margin:0;padding-left:1.1em;font-size:13.5px;line-height:1.7}
.ptopic.warn{background:color-mix(in srgb,var(--pink) 16%,transparent)}
.csearch{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);margin:0 0 10px}
.csearch svg{width:18px;height:18px;flex:none;color:var(--muted)}
.csearch input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:11px 0;outline:none}
.chip.mine{border-color:var(--accent);color:var(--accent)}
.chip.mine[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dent-tools .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.dc.cls{position:relative}
.dc.cls b{padding-right:62px;line-height:1.45}
.dc.cls .cw{position:absolute;right:12px;top:12px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.dc .acc{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;margin:4px 0 1px}
.dc .acc svg{width:15px;height:15px;flex:none;color:var(--accent)}
.dc .inf{margin:2px 0 6px;font-size:12.5px;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dc .muted{color:var(--muted);font-size:12px}
.dc .row2 .lk{display:flex;flex-wrap:wrap;gap:4px 12px}
.orig{margin:14px 0 4px}
.orig summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--accent);padding:6px 0}
.orig .wards{margin-top:8px}
.more-dent{display:block;margin:10px auto 0;border:1px solid var(--line);background:none;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer}
</style>

  const w=e.target.closest("[data-dw]");if(w){dentWard=w.dataset.dw;dentShow=20;$("#sheet").querySelectorAll("[data-dw]").forEach(b=>b.setAttribute("aria-pressed",b===w));$("#dentBox").innerHTML=dentList();return}
  const f=e.target.closest("[data-df]");if(f){dentF=f.dataset.df;dentShow=20;$("#sheet").querySelectorAll("[data-df]").forEach(b=>b.setAttribute("aria-pressed",b===f));$("#dentBox").innerHTML=dentList();return}
  if(e.target.closest("[data-dmore]")){dentShow+=20;$("#dentBox").innerHTML=dentList()}
});


/* ---------- mypage ---------- */
let pickIcon=0;
$("#fWard").innerHTML=`<option value="">選択してください</option>`+WARDS.map(w=>`<option>${w}</option>`).join("");
function renderIconPick(){$("#iconPick").innerHTML=AVATARS.map((a,i)=>`<button type="button" data-icon="${i}" aria-pressed="${i===pickIcon}">${avatar(i)}${a.n}</button>`).join("")}
$("#iconPick").addEventListener("click",e=>{const b=e.target.closest("[data-icon]");if(!b)return;pickIcon=+b.dataset.icon;renderIconPick()});
function fillMyPage(){
  const p=S.profile;
  $("#myTitle").textContent=p?"マイページ":"マイページ登録";
  $("#profileCard").innerHTML=p?`${avatar(p.icon,"lg")}<div><b>${esc(p.name)}</b><small>さいたま市${esc(p.ward)}${S.town?" ・ "+esc(S.town):""} ・ メンバー</small></div>`
    :`${avatar(-1,"lg")}<div><b>未登録</b><small>名前とアイコンを登録して、メンバーになりましょう</small></div>`;
  $("#fName").value=p?.name||"";$("#fWard").value=p?.ward||"";$("#fTown").value=S.town||"";
  pickIcon=p?p.icon:0;renderIconPick();
  $("#saveBtn").textContent=p?"変更を保存":"登録する";
}
$("#myForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("#fName").value.trim(),ward=$("#fWard").value,town=$("#fTown").value.trim();
  const st=$("#saveStatus");
  if(!name){st.textContent="ニックネームを入力してください";$("#fName").focus();return}
  if(!ward){st.textContent="お住まいの区を選んでください";$("#fWard").focus();return}
  const prof={name,icon:pickIcon,ward};
  $("#saveBtn").disabled=true;st.textContent="保存しています…";
  S.profile=prof;S.town=town;LS.set("wolly.profile",{...prof,town});
  if(S.db&&S.uid){
    try{await S.db.doc("members/"+S.uid).set({...prof,at:Date.now()});await S.db.doc(`data/users/${S.uid}/profile`).set({town});st.textContent="保存しました"}
    catch(err){st.textContent="この端末に保存しました（メンバー一覧への反映には書き込み権限が必要です）"}
  }else st.textContent="この端末に保存しました";
  $("#saveBtn").disabled=false;
  renderAll();fillMyPage();
});

/* ---------- glass sheet ---------- */
let sheetKind=null;
function fillNewsSheet(animate=true){
  const list=sortedNews();
  $("#sheetBody").innerHTML=`<div class="eyebrow">SAITAMA NEWS</div><h3 id="sheetTitle">さいたま市の最新ニュース</h3><p class="sub">${esc(stampText())}　市のホームページ・ニュースから定期的に集めています</p>
    <div class="news">${list.length?list.map((n,i)=>newsItem(n,animate?i:0)).join(""):newsEmpty()}</div><p class="foot">詳しい内容は各リンク先でご確認ください。</p>`;
}
function fillNearSheet(){
  const body=$("#sheetBody");
  if(!S.profile){
    body.innerHTML=`<div class="gate">${avatar(-1,"lg")}<h3 id="sheetTitle">マイページ未登録です</h3><p>お住まいの区（と町名）を登録すると、<br>病院・保育園・幼稚園・地域の情報を家の近い順で見られます。</p><a class="btn" href="#mypage">マイページを登録する</a></div>`;
  }else{
    body.innerHTML=`<div class="eyebrow">NEAR HOME</div><h3 id="sheetTitle">家の近くで探す</h3><p class="sub">${esc(area())} の近くから探します。タップすると地図アプリで家の近い順に表示されます。</p>
    <div class="grid ngrid">${NEAR.map((n,i)=>n.sub
      ?`<div class="nwide" style="--n:${i}">${nic(n.ic,n.bg)}<b>${n.t}</b><div class="nsub">${n.sub.map(([lb,q])=>`<a href="${esc(mapUrl(q))}" target="_blank" rel="noopener">${lb}<small>近い順 ›</small></a>`).join("")}</div></div>`
      :`<a href="${esc(mapUrl(n.q))}" target="_blank" rel="noopener" style="--n:${i}">${nic(n.ic,n.bg)}<b>${n.t}</b><small>近い順で見る</small></a>`).join("")}</div>
    <p class="foot">エリアの変更は <a href="#mypage">マイページ</a> から</p>`;
  }
}
function sheetHtml(kind){
  const [k,n]=kind.split("-");const i=+n;
  if(kind==="dent")return sheetDent();
  if(kind==="dk-kid"||kind==="dk-mom")return sheetDentalKind(kind);
  if(k==="m")return sheetMoney(i);
  if(k==="h"&&HOKATSU[i])return sheetInfo(HOKATSU[i],"hokatsu",i);
  if(k==="x"&&HEALTH[i])return sheetInfo(HEALTH[i],"health",i);
  if(k==="s"&&SHOPS[i])return sheetInfo(SHOPS[i],"shop",i);
  if(k==="l")return sheetLesson(i);
  if(k==="p")return sheetPark(i);
  return "";
}
const SHEETS=/^(news|near|dent|dk-kid|dk-mom|[mhxslp]-\d+)$/;
function openSheet(kind){
  closeViewer();sheetKind=kind;
  if(kind==="news")fillNewsSheet();else if(kind==="near")fillNearSheet();else $("#sheetBody").innerHTML=sheetHtml(kind);
  const sh=$("#sheet");sh.scrollTop=0;
  sh.classList.remove("on");void sh.offsetWidth;
  requestAnimationFrame(()=>{$("#scrim").classList.add("on");sh.classList.add("on")});
  document.body.classList.add("sheet-open");
  setTimeout(()=>$("#sheetClose").focus({preventScroll:true}),60);
}
function closeSheet(){closeViewer();sheetKind=null;$("#scrim").classList.remove("on");$("#sheet").classList.remove("on");document.body.classList.remove("sheet-open")}
$("#scrim").addEventListener("click",()=>goBack());
$("#sheetClose").addEventListener("click",()=>goBack());
$("#sheet").addEventListener("click",e=>{if(e.target.closest("a[href='#mypage']"))closeSheet()});
let viewerOpen=false;
function openViewer(id,title){
  const v=$("#viewer"),f=$("#vFrame");
  $("#vTitle").textContent=title||"";v.classList.remove("ready");
  f.onload=()=>v.classList.add("ready");f.src=PAGES_BASE+id+".html";f.title=title||"";
  v.hidden=false;void v.offsetWidth;v.classList.add("on");viewerOpen=true;
  setTimeout(()=>$("#vClose").focus({preventScroll:true}),60);
}
function closeViewer(){if(!viewerOpen)return;viewerOpen=false;const v=$("#viewer");v.classList.remove("on");
  setTimeout(()=>{if(!viewerOpen){v.hidden=true;$("#vFrame").src="about:blank"}},420)}
$("#sheet").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(b)openViewer(b.dataset.view,b.dataset.vt)});
$("#vClose").addEventListener("click",closeViewer);
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(viewerOpen){closeViewer();return}if(sheetKind)goBack()});

/* ---------- routing ---------- */
let route="home",lastSheet=null,inApp=false;
function goBack(){if(sheetKind&&inApp){history.back()}else location.hash=""}
function applyRoute(){
  let h=location.hash.replace("#","");
  if(h.startsWith("go-")){const id={money:"row-money",hokatsu:"row-hokatsu",health:"row-health",lesson:"row-lesson",park:"row-park",shop:"row-shop"}[h.slice(3)];
    history.replaceState(null,"",location.pathname+location.search);h="";closeSheet();route="home";
    document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-home"));
    requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start"}));
    updateChrome("",null);return}
  const views={mypage:"mypage"};
  const sheet=SHEETS.test(h)?h:null;
  const prev=route;
  route=views[h]||(sheet?prev:"home");
  if(!sheet)closeSheet();
  lastSheet=sheet;
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+route));
  updateChrome(h,sheet);
  if(route==="mypage"&&prev!=="mypage")fillMyPage();
  if(sheet)openSheet(sheet);
  if(h==="search")requestAnimationFrame(()=>document.getElementById("cats")?.scrollIntoView({behavior:"smooth",block:"center"}));
  else if(prev!==route&&!sheet)window.scrollTo(0,0);
}
function updateChrome(h,sheet){
  document.querySelectorAll(".tabbar a").forEach(a=>{const t=a.dataset.tab;
    const on=sheet?t===sheet:(h==="search"?t==="search":t===route);
    if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  $("#back").hidden=route==="home"&&!sheet&&h!=="search";
}
window.addEventListener("hashchange",()=>{inApp=true;applyRoute()});
$("#back").addEventListener("click",goBack);

function renderAll(){renderMe();renderNews();renderCats();renderRows()}


/* ---------- local profile first, then shared data ---------- */
const local=LS.get("wolly.profile");
if(local&&local.name){S.profile={name:local.name,icon:local.icon|0,ward:local.ward};S.town=local.town||""}
renderAll();applyRoute();

(async()=>{
  const use=window.claude&&window.claude.use;
  if(!use){if(STATIC_NEWS){S.news=STATIC_NEWS.items;S.newsAt=STATIC_NEWS.updatedAt}S.newsLoaded=true;renderNews();return}
  const [db,user]=await Promise.all([use("db").catch(()=>null),use("user").catch(()=>null)]);
  if(user){try{S.uid=await user.id()}catch(e){}try{S.isOwner=!!(await user.isOwner())}catch(e){}
    try{const c=await user.can("data.write");if(c===false)S.canWrite=false}catch(e){}}
  if(!db){S.newsLoaded=true;renderNews();return}
  S.db=db;
  const timer=setTimeout(()=>{S.newsLoaded=true;renderNews()},10000);
  db.collection("news").limit(60).onSnapshot(snap=>{clearTimeout(timer);S.news=snap.docs.map(d=>({id:d.id,...d.data()}));S.newsLoaded=true;renderNews()},()=>{clearTimeout(timer);S.newsLoaded=true;renderNews()});
  db.doc("meta/news").onSnapshot(s=>{const d=s.exists?s.data():null;S.newsAt=d?.updatedAt||null;renderNews()},()=>{});
  db.collection("members").orderBy("at","desc").limit(60).onSnapshot(snap=>{S.members=snap.docs.map(d=>({id:d.id,...d.data()}));renderMe()},()=>{});
  if(S.uid){
    try{const m=await db.doc("members/"+S.uid).get();
      if(m.exists){const d=m.data();S.profile={name:d.name,icon:d.icon|0,ward:d.ward}}
      else if(S.profile){db.doc("members/"+S.uid).set({...S.profile,at:Date.now()}).catch(()=>{})}
      const p=await db.doc(`data/users/${S.uid}/profile`).get();if(p.exists)S.town=p.data().town||S.town;
      LS.set("wolly.profile",S.profile?{...S.profile,town:S.town}:null);
    }catch(e){}
  }
  renderAll();if(route==="mypage")fillMyPage();
})();
/* ---------- splash ---------- */
const splash=$("#splash"),stage=$("#stage"),bar=$("#bar"),pct=$("#pct"),drift=$("#drift");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const MIN=reduce?600:4300;
let start=0,done=false,loaded=document.readyState==="complete",raf;
for(let i=0;i<14;i++){const el=document.createElement("i");
  el.style.cssText=`left:${Math.random()*100}%;--s:${6+Math.random()*10}px;--r:${Math.random()*360}deg;--x:${(Math.random()-.5)*120}px;--d:${8+Math.random()*7}s;--delay:${-Math.random()*8}s`;drift.appendChild(el)}
function tick(t){
  if(!start)start=t;const el=t-start;
  let p=Math.min(1,el/MIN);p=1-Math.pow(1-p,2);if(!loaded)p=Math.min(p,.9);
  bar.style.transform=`scaleX(${p})`;pct.textContent=Math.round(p*100)+"%";
  if(p>=1&&el>=MIN){finish();return}raf=requestAnimationFrame(tick);
}
function finish(){
  if(done)return;done=true;cancelAnimationFrame(raf);bar.style.transform="scaleX(1)";pct.textContent="100%";
  stage.classList.add("is-leaving");
  setTimeout(()=>{splash.classList.add("is-out");document.body.classList.add("is-ready")},reduce?0:420);
  setTimeout(()=>{splash.hidden=true;document.body.classList.remove("is-loading")},reduce?450:1450);
}
function play(){
  done=false;start=0;splash.hidden=false;splash.classList.remove("is-out");stage.classList.remove("is-leaving");
  document.body.classList.add("is-loading");document.body.classList.remove("is-ready");
  splash.querySelectorAll(".l-emblem,.l-text,.l-swash,.loader,.skip").forEach(el=>{el.style.animation="none";void el.offsetWidth;el.style.animation=""});
  window.scrollTo(0,0);raf=requestAnimationFrame(tick);
}
window.addEventListener("load",()=>{loaded=true});
$("#skip").addEventListener("click",()=>{loaded=true;finish()});
$("#replay").addEventListener("click",()=>{loaded=true;play()});
document.body.classList.add("is-loading");raf=requestAnimationFrame(tick);
})();
</script>
